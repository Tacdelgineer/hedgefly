<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Natural Selection Capital HQ</title>
<style>
  :root{--paper:#07070b;--ghost:#d8dcff;--slate:#5b6cff;--cyan:#27f2d2;--magenta:#ff3d9a;--gold:#ffc93c;--amber:#ff7a1a;
        --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);overscroll-behavior:none}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
  #stage.drag{cursor:grabbing}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:9px 14px 11px;display:flex;flex-wrap:wrap;align-items:center;
      gap:10px;font:12px/1.5 var(--mono);color:var(--ghost);letter-spacing:.08em;
      background:linear-gradient(to top,rgba(7,7,11,.96),rgba(7,7,11,.78));border-top:1px solid rgba(91,108,255,.45);
      user-select:none;text-transform:uppercase}
  #ui button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ghost);background:transparent;
      border:1px solid rgba(216,220,255,.45);padding:3px 10px;cursor:pointer}
  #ui button:hover{border-color:var(--ghost);background:rgba(91,108,255,.18)}
  #ui button.on{color:var(--gold);border-color:var(--gold)}
  #play{min-width:66px;color:var(--gold)!important;border-color:var(--gold)!important}
  #scrub{flex:1 1 200px;min-width:140px;accent-color:var(--gold);height:18px}
  #label{min-width:150px}
  #rooms{display:flex;gap:6px;flex-wrap:wrap}
  #stat{flex-basis:100%;opacity:.8;font-size:11px;text-transform:none;letter-spacing:.04em}
  #stat .real{color:var(--cyan)} #stat .scr{color:var(--magenta)}
  /* the terminal renders at its own 1280x720 and is scaled down: a true miniature, not a squeeze */
  #inset{--s:.44;position:fixed;right:14px;bottom:96px;width:calc(1280px*var(--s));height:calc(720px*var(--s));
      border:1px solid rgba(216,220,255,.35);background:#000;display:none;overflow:hidden}
  #inset.open{display:block}
  #inset iframe{width:1280px;height:720px;border:0;display:block;transform:scale(var(--s));transform-origin:0 0}
  @media (max-width:1100px){#inset{--s:.34}}
  #inset .tag{position:absolute;left:8px;top:-18px;font:10px var(--mono);letter-spacing:.14em;color:var(--ghost);opacity:.7}
  body.vertical #ui{padding-bottom:16px} body.vertical #label{min-width:0}
  body.clean #ui,body.clean #inset{display:none!important}
  /* director mode's legend: the keys, where a hand on the keyboard can see them */
  #legend{position:fixed;right:14px;top:14px;display:grid;grid-template-columns:auto auto;
      gap:2px 12px;align-items:baseline;padding:10px 13px;font:11px/1.45 var(--mono);
      color:var(--ghost);letter-spacing:.06em;text-transform:uppercase;pointer-events:none;
      background:rgba(7,7,11,.82);border:1px solid rgba(91,108,255,.4)}
  #legend b{color:var(--gold);font-weight:400;white-space:nowrap}
  #legend span{opacity:.72}
  body.clean #legend,body.hidden-ui #legend{display:none!important}
  body.vertical #legend{font-size:10px;top:10px;right:10px}
  body.vertical #inset{--s:calc((100vw - 28px) / 1280px);bottom:150px}
</style>
</head><body>
<canvas id="stage" aria-label="Natural Selection Capital HQ: a neon riso diorama of two tribes of fly brains trading Bitcoin"></canvas>
<div id="inset"><span class="tag">fly terminal · inset</span><iframe title="fly terminal" loading="lazy"></iframe></div>
<div id="legend" aria-hidden="true"></div>
<div id="ui">
  <button id="play">pause</button>
  <input id="scrub" type="range" min="0" max="0" value="0" step="1" aria-label="generation">
  <span id="label">generation 0</span>
  <span id="rooms"></span>
  <button id="building" title="the whole building (b)">building</button>
  <button id="herocam" title="follow the hero fly on its rounds (y)">hero cam</button>
  <button id="terminal" title="the fly terminal, as an inset (t)">terminal</button>
  <div id="stat"></div>
</div>
<!--NEON-RISO--><script src="../lib/neon-riso.js"></script><!--/NEON-RISO-->
<script>
'use strict';
/* =====================================================================
   NATURAL SELECTION CAPITAL HQ — neon riso (visuals/style.md), data contract v2
   (visuals/hq/data-contract.md). Six rooms, one run, replayed generation by generation.
   ===================================================================== */
if(new URLSearchParams(location.search).has('record')){window.__HEDGEFLY_VCLOCK__=0;window.__HEDGEFLY_VCLOCK_DRIVEN__=true}
/* =====================================================================
   RUNTIME — layout, camera, 12fps boil, input, export
   ===================================================================== */
const ROOMS=[];
function room(def){ROOMS.push({w:10,d:10,h:3,col:0,row:0,...def})}
const stage=document.getElementById('stage'),ctx=stage.getContext('2d',{alpha:false});
const qs=new URLSearchParams(location.search);
const FPS=12,BOIL_EVERY=4,GAP=2.5,MIN_Z=.15,MAX_Z=6;
// One clock for everything. The recorder (scripts/record_hq.mjs) sets __HEDGEFLY_VCLOCK__ and
// steps it frame by frame, so a recording is the same every time and never drops a frame.
/* Two clocks. The recorder sets __HEDGEFLY_VCLOCK__ and owns time exactly. Live, time is
   accumulated by hand at RATE, so director mode can run the world in slow motion without any
   other code knowing about it. */
let SOFT=0,softLast=null,RATE=1;
function advance(){const now=performance.now();if(softLast===null)softLast=now;
  SOFT+=Math.min(100,now-softLast)*RATE;softLast=now}
const NOW=()=>window.__HEDGEFLY_VCLOCK__!=null?window.__HEDGEFLY_VCLOCK__:SOFT;
let W=1,H=1,dpr=1,started=NOW(),lastFrame=-1,lastCam='';
const cam={x:0,y:0,zoom:1};let vel={x:0,y:0},tween=null,idleSince=NOW(),tourIndex=-1;
// The camera rests on camBase and drifts slowly around it; tweens and the hero cam move the base.
let camBase={x:0,y:0,zoom:1},userMoved=false;

function layout(){
  const SLOT=Math.max(...ROOMS.map(r=>Math.max(r.w,r.d)))+GAP;   // grid pitch in tiles
  for(const r of ROOMS){r.oi=r.col*SLOT;r.oj=r.row*SLOT;[r.ox,r.oy]=iso(r.oi,r.oj);
    const pts=[];for(const a of[-.5,r.w+.3])for(const b of[-.5,r.d+.3])for(const z of[-1,r.h+.6])pts.push(iso(r.oi+a,r.oj+b,z));
    r.bounds=[Math.min(...pts.map(q=>q[0])),Math.min(...pts.map(q=>q[1])),Math.max(...pts.map(q=>q[0])),Math.max(...pts.map(q=>q[1]))];}
  ROOMS.sort((a,b)=>(a.oi+a.oj)-(b.oi+b.oj));
}
const framing=b=>({x:(b[0]+b[2])/2,y:(b[1]+b[3])/2,zoom:clamp(Math.min(W/(b[2]-b[0]),H/(b[3]-b[1]))*.92,MIN_Z,MAX_Z)});
function fitAll(){const b=ROOMS.reduce((a,r)=>[Math.min(a[0],r.bounds[0]),Math.min(a[1],r.bounds[1]),Math.max(a[2],r.bounds[2]),Math.max(a[3],r.bounds[3])],[1e9,1e9,-1e9,-1e9]);return framing(b)}
function flyTo(target,ms=1100){tween={from:{...cam},to:target,start:NOW(),ms}}
const toWorld=(sx,sy)=>({x:(sx-W/2)/cam.zoom+cam.x,y:(sy-H/2)/cam.zoom+cam.y});
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(2,devicePixelRatio||1);stage.width=Math.round(W*dpr);stage.height=Math.round(H*dpr);lastCam=''}

function draw(frameNo){
  const t=frameNo/FPS,boil=Math.floor(frameNo/BOIL_EVERY),z=cam.zoom;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=PAPER_CSS;ctx.fillRect(0,0,stage.width,stage.height);
  ctx.setTransform(dpr*z,0,0,dpr*z,dpr*(W/2-cam.x*z),dpr*(H/2-cam.y*z));
  const a=toWorld(0,0),b=toWorld(W,H);
  for(const r of ROOMS){
    if(r.bounds[2]<a.x||r.bounds[0]>b.x||r.bounds[3]<a.y||r.bounds[1]>b.y)continue;
    const pen=makePen(ctx,{ox:r.ox,oy:r.oy,boil});
    try{if(r.shell!==false)pen.shell(r);r.draw&&r.draw(pen,t,stream(r.id))}catch(e){console.error('room '+r.id,e)}
    ctx.globalCompositeOperation='source-over';ctx.setLineDash([]);
  }
  try{if(typeof overlay==='function')overlay(makePen(ctx,{ox:0,oy:0,boil}),t,a,b)}catch(e){console.error('overlay',e)}
  ctx.globalCompositeOperation='source-over';ctx.setLineDash([]);
  ctx.globalCompositeOperation='screen';ctx.fillStyle=grain(ctx);ctx.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);ctx.globalCompositeOperation='source-over';
}

function frame(){
  if(!window.__HEDGEFLY_VCLOCK_DRIVEN__){requestAnimationFrame(frame);advance()}
  stepFrame();
}
// camera drift: a slow, never-repeating wander, only once the viewer has left the camera alone
function drift(s){return {x:Math.sin(s*.13)*16+Math.sin(s*.047)*9,y:Math.sin(s*.09+1.3)*9,z:1+Math.sin(s*.061)*.035}}
function stepFrame(){
  const now=NOW();
  if(innerWidth!==W||innerHeight!==H)resize();
  if(tween){const u=clamp((now-tween.start)/tween.ms,0,1),e=ease(u);
    cam.x=lerp(tween.from.x,tween.to.x,e);cam.y=lerp(tween.from.y,tween.to.y,e);cam.zoom=lerp(tween.from.zoom,tween.to.zoom,e)*(1-Math.sin(u*Math.PI)*.12);
    if(u>=1){camBase={...tween.to};tween=null}}
  else if(pointers.size||userMoved){camBase={x:cam.x,y:cam.y,zoom:cam.zoom};userMoved=false}
  else{
    if(Math.abs(vel.x)+Math.abs(vel.y)>1e-5){camBase.x+=vel.x*16;camBase.y+=vel.y*16;vel.x*=.92;vel.y*=.92}
    if(typeof heroCamTarget==='function'){const h=heroCamTarget();
      if(h){camBase.x=lerp(camBase.x,h.x,.09);camBase.y=lerp(camBase.y,h.y,.09);camBase.zoom=lerp(camBase.zoom,h.zoom,.04)}}
    const quiet=!qs.has('still')&&now-idleSince>3500,d=quiet?drift(now/1000):{x:0,y:0,z:1};
    cam.x=camBase.x+d.x;cam.y=camBase.y+d.y;cam.zoom=camBase.zoom*d.z;
  }
  const f=qs.has('frame')?+qs.get('frame'):Math.floor((now-started)/1000*FPS);
  const key=`${cam.x.toFixed(2)},${cam.y.toFixed(2)},${cam.zoom.toFixed(4)},${W},${H},${GEN},${Math.round(SEL*48)}`;
  if(f!==lastFrame||key!==lastCam){draw(f);lastFrame=f;lastCam=key}
}

const pointers=new Map();let drag=null,pinch=null;
// Taking the camera by hand cancels a move in flight, and keeps it where it had got to:
// dropping the tween without committing cam would snap the camera back to where it left.
const touch=()=>{idleSince=NOW();if(tween)camBase={x:cam.x,y:cam.y,zoom:cam.zoom};tween=null;userMoved=true};
stage.addEventListener('pointerdown',e=>{touch();stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});vel={x:0,y:0};
  drag={x:e.clientX,y:e.clientY,t:NOW()};
  if(pointers.size===2){const [p1,p2]=[...pointers.values()];pinch={d:Math.hypot(p1.x-p2.x,p1.y-p2.y),zoom:cam.zoom,anchor:toWorld((p1.x+p2.x)/2,(p1.y+p2.y)/2)}}
  stage.classList.add('drag')});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;touch();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2&&pinch){const [p1,p2]=[...pointers.values()],mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    cam.zoom=clamp(pinch.zoom*Math.hypot(p1.x-p2.x,p1.y-p2.y)/Math.max(1,pinch.d),MIN_Z,MAX_Z);cam.x=pinch.anchor.x-(mx-W/2)/cam.zoom;cam.y=pinch.anchor.y-(my-H/2)/cam.zoom;return}
  if(!drag)return;const now=NOW(),dx=e.clientX-drag.x,dy=e.clientY-drag.y,dt=Math.max(8,now-drag.t);
  cam.x-=dx/cam.zoom;cam.y-=dy/cam.zoom;vel={x:lerp(vel.x,-dx/cam.zoom/dt,.6),y:lerp(vel.y,-dy/cam.zoom/dt,.6)};drag={x:e.clientX,y:e.clientY,t:now}});
const up=e=>{pointers.delete(e.pointerId);pinch=null;if(pointers.size)return;if(!drag||NOW()-drag.t>90)vel={x:0,y:0};drag=null;stage.classList.remove('drag')};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();touch();vel={x:0,y:0};const a=toWorld(e.clientX,e.clientY);
  cam.zoom=clamp(cam.zoom*Math.exp(-clamp(e.deltaY,-300,300)*.0015),MIN_Z,MAX_Z);cam.x=a.x-(e.clientX-W/2)/cam.zoom;cam.y=a.y-(e.clientY-H/2)/cam.zoom},{passive:false});
stage.addEventListener('dblclick',e=>{const w=toWorld(e.clientX,e.clientY),r=ROOMS.find(r=>w.x>=r.bounds[0]&&w.x<=r.bounds[2]&&w.y>=r.bounds[1]&&w.y<=r.bounds[3]);
  if(r){touch();tourIndex=ROOMS.indexOf(r);flyTo(framing(r.bounds))}});
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toLowerCase(),step=(e.shiftKey?28:120)/cam.zoom;touch();
  /* A key moves camBase, not just cam: cam is rebuilt from camBase plus the idle drift every
     frame, so panning only cam would be undone before it was ever seen. */
  const pan=(dx,dy)=>{camBase.x+=dx;camBase.y+=dy;cam.x+=dx;cam.y+=dy};
  const zoomBy=f=>{camBase.zoom=clamp(camBase.zoom*f,MIN_Z,MAX_Z);cam.zoom=clamp(cam.zoom*f,MIN_Z,MAX_Z)};
  if(k==='arrowleft'||k==='a')pan(-step,0);else if(k==='arrowright'||k==='d')pan(step,0);
  else if(k==='arrowup'||k==='w')pan(0,-step);else if(k==='arrowdown'||k==='s')pan(0,step);
  else if(k==='+'||k==='=')zoomBy(1.2);else if(k==='-')zoomBy(1/1.2);
  else if(k==='p')stage.toBlob(b=>{const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=(document.title||'print')+'.png';l.click()});
  else return;e.preventDefault()});

function start(){
  layout();resize();
  const r=ROOMS.find(r=>r.id===qs.get('room'));
  Object.assign(cam,r?framing(r.bounds):fitAll());
  if(qs.has('zoom'))cam.zoom=+qs.get('zoom');
  camBase={...cam};
  if(!window.__HEDGEFLY_VCLOCK_DRIVEN__)requestAnimationFrame(frame);
}


/* ---------- the run being replayed ---------- */
let RUN=null,GEN=0,PLAYING=true;
// SEL: how far through this generation's selection event we are - 0 while the flies trade, 1 once
// the eliminated have fallen, the survivors lit up and the children hatched. Paused views show 1.
let SEL=1,OPEN=1;
const easeIn=u=>u*u*u;
const elimAt=g=>RUN&&RUN.frames[g]?RUN.tribes.reduce((n,t)=>n+RUN.frames[g].tribes[t].eliminated,0):0;
const TRIBE_INK={real:'cyan',scrambled:'magenta'};
const F=()=>RUN&&RUN.frames[Math.min(GEN,RUN.frames.length-1)];
const hero=tribe=>{const f=F();return f&&f.heroes[tribe]};
const eliminatedBefore=g=>{let n=0;if(RUN)for(let k=0;k<g&&k<RUN.frames.length;k++)for(const t of RUN.tribes)n+=RUN.frames[k].tribes[t].eliminated;return n};
const fallen=()=>eliminatedBefore(GEN)+Math.round(SEL*elimAt(GEN));
const S3=v=>String(v).padStart(2,'0');
const fmtMin=m=>m>=90?(m/60).toFixed(1).replace(/\.0$/,'')+' H':Math.round(m)+' MIN';

/* =====================  THE LAB  =====================
   Where it starts: a DGX Spark on a desk, a jar of real fruit flies, a fly on the night shift. */
room({id:'lab',col:0,row:0,w:7,d:7,h:3,
  style:{floor:['slate',.3],wall:['slate',.13],wall2:['slate',.17],planks:true},
  draw(pen,t,R){
    const p=pen.p,f=F(),busy=f?Math.min(1,f.tribes.real.trades.median_per_day/10):.4;
    pen.window('j',1.1,1.15,1.9,1.35,{sky:'slate',patch:false});
    for(let k=0;k<9;k++){const [x,y]=pen.wallQuad('j',1.2+rand(R,0,1.7),1.25+rand(R,0,1.2),.01,.01,.05)[0];pen.dot(x,y,.9,'ghost',.5+.5*Math.sin(t*2+k))}
    const board=pen.wallQuad('i',3.3,.95,3.4,1.75,.05);
    pen.shape(board,['slate',.12],{w:1.2});
    text(pen,'REAL',pen.wallQuad('i',3.5,2.4,.01,.01,.11)[0],17,{wall:'i',ink:'cyan'});
    text(pen,'VS',pen.wallQuad('i',3.5,2.04,.01,.01,.11)[0],12,{wall:'i',tone:.6});
    text(pen,'SHUFFLED',pen.wallQuad('i',3.5,1.66,.01,.01,.11)[0],13,{wall:'i',ink:'magenta'});
    if(f)text(pen,'GEN '+S3(f.generation),pen.wallQuad('i',3.5,1.2,.01,.01,.11)[0],13,{wall:'i',tone:.8});
    pen.rug(1.2,2.6,4.4,3.6,{ink:'slate',tone:.18,border:'slate'});
    pen.glow(3.1,3.2,.78,1.6,'ghost',.35+busy*.3);
    pen.bookcase('i',.4,2.3,2.2,{rows:4});
    pen.plant(6.4,.9,0,{t,size:1.1});
    pen.lamp(.75,4.9,{t});
    pen.table(2.2,2.9,3.4,1.7,.75,{ink:'slate',tone:.32});
    // the Spark: a small dark slab whose front panel breathes with the flies' trading
    pen.box(2.5,3.05,.75,1.25,.9,.5,{ink:'slate',tone:.55,shadow:true});
    const [fx,fy]=p(2.5,3.9,.9);
    for(let k=0;k<7;k++)pen.line([[fx+6+k*5,fy-3],[fx+6+k*5,fy-14]],'ghost',.8,{amp:.15,tone:.45});
    const pulse=.55+.45*Math.sin(t*(1.4+busy*3.2));
    pen.halo(fx+48,fy-8,9,'ghost',pulse);pen.dot(fx+48,fy-8,2.4,'ghost',pulse);
    text(pen,'DGX SPARK',[fx+2,fy-31],6.5,{tone:.8,w:.8});
    for(let k=0;k<4;k++){const [ax,ay]=p(2.6+k*.22,3.98,.74),[bx,by]=p(2.4+k*.3,4.7,0);
      pen.line(smooth([[ax,ay],[ax+8,ay+16+k*3],[bx,by]],false,2),'slate',1.5,{tone:.7,amp:.5})}
    // the jar: the actual animals, the real tribe's namesakes
    const [jx,jy]=p(4.9,3.2,.76);
    pen.shape(smooth([[jx-14,jy],[jx+14,jy],[jx+13,jy-36],[jx-13,jy-36]],true,1),['slate',.1],{w:1.1});
    pen.line([[jx-14,jy-36],[jx+14,jy-36]],'ghost',1.6,{tone:.8});
    for(let k=0;k<7;k++){const a=t*(.7+k*.23)+k,r=4+k*1.6;
      pen.minifly(jx+Math.cos(a*1.7)*r,jy-13-Math.sin(a*2.1)*11,.8,'cyan',.9,t,k)}
    text(pen,'D. MELANOGASTER',[jx+18,jy-30],5,{tone:.6,w:.6});
    pen.books(1.35,3.15,.76,3);
    const [mx,my]=p(4.1,4.0,.75);
    pen.shape(smooth([[mx-4,my],[mx+4,my],[mx+4,my-8],[mx-4,my-8]],true,1),['slate',.5],{w:.9});
    pen.steam(mx,my-10,t,{n:3});
    pen.chair(3.0,5.1,{back:'i',ink:'slate',tone:.4});
    pen.fly(3.3,5.4,.45,{t,pose:'sit',ink:'slate',scale:1.25,facing:-1,phase:.3});
    for(let k=0;k<5;k++){const i=rand(R,1.1,2.2),j=rand(R,5.2,6.3);
      pen.shape([p(i,j,.01),p(i+.4,j+.05,.01),p(i+.36,j+.42,.01),p(i-.04,j+.37,.01)],['slate',.12],{w:.6})}
  }});

/* =====================  THE BRAIN ROOM  =====================
   Two connectome sculptures: the fly's own wiring, and the same wiring shuffled. */
room({id:'brain',col:1,row:0,w:7,d:7,h:3.4,
  style:{floor:['slate',.34],wall:['slate',.12],wall2:['slate',.16],planks:false},
  draw(pen,t,R){
    const p=pen.p,f=F();
    for(const [i,j,ink] of[[1.7,4.5,'cyan'],[5.1,1.5,'magenta']]){
      pen.box(i-.6,j-.6,0,1.2,1.2,.6,{ink:'slate',tone:.45,topInk:ink,top:.28});
      pen.glow(i,j,.02,1.8,ink,.4);
    }
    function sculpture(ci,cj,cz,radius,ink,tangled,key,speed){
      const S=stream(key),N=20,nodes=[];
      for(let k=0;k<N;k++){const a=rand(S,0,TAU),b=Math.acos(rand(S,-1,1)),r=radius*(.55+.45*rand(S,0,1));
        nodes.push([ci+r*Math.sin(b)*Math.cos(a),cj+r*Math.sin(b)*Math.sin(a),cz+r*Math.cos(b)*.9])}
      const edges=[];
      for(let k=0;k<N;k++){
        const near=nodes.map((n,m)=>[m,Math.hypot(n[0]-nodes[k][0],n[1]-nodes[k][1],n[2]-nodes[k][2])]).filter(([m])=>m!==k).sort((a,b)=>a[1]-b[1]);
        for(const m of tangled?[randi(S,0,N-1),randi(S,0,N-1)]:[near[0][0],near[1][0]])edges.push([k,m]);
      }
      for(const [a,b] of edges)pen.line([p(...nodes[a]),p(...nodes[b])],ink,.8,{tone:.4,amp:.6});
      const wave=(t*speed)%1;
      for(const [a,b] of edges){const u=((a*7+b*13)%17)/17,d=(wave-u+1)%1;
        if(d<.12){const A=p(...nodes[a]),B=p(...nodes[b]),k=d/.12;pen.halo(lerp(A[0],B[0],k),lerp(A[1],B[1],k),5,ink,.9)}}

room({id:'floor',col:0,row:1,w:10,d:8,h:3.4,
  style:{floor:['slate',.26],wall:['slate',.12],wall2:['slate',.15],planks:true},
  draw(pen,t,R){

    pen.shape(pen.wallQuad('i',U0,Z0,U1-U0,Z1-Z0,.06),['paper',0],{w:.8,lineTone:.4});
    const days=RUN?RUN.windows:[],gap=.12,dw=(U1-U0-gap*(days.length-1))/Math.max(1,days.length);
    days.forEach((day,d)=>{
      const bars=day.candles||[];if(!bars.length)return;
      const lo=Math.min(...bars.map(b=>b[2])),hi=Math.max(...bars.map(b=>b[1])),span=Math.max(hi-lo,1e-9);
      const z=v=>Z0+.12+(v-lo)/span*(Z1-Z0-.34),u0=U0+d*(dw+gap),bw=dw/bars.length;
      const W=(u,zz)=>p(u,.07,zz);
      bars.forEach(([o,h,l,c],k)=>{const u=u0+(k+.5)*bw,ink=c>=o?'ghost':'slate',tone=c>=o?.8:.9;
        pen.line([W(u,z(l)),W(u,z(h))],ink,.7,{tone:tone*.8,amp:0});
        const a=z(Math.min(o,c)),b=Math.max(z(Math.max(o,c)),a+.012);
        pen.tint([W(u-bw*.32,a),W(u+bw*.32,a),W(u+bw*.32,b),W(u-bw*.32,b)],ink,tone)});
      if(d)pen.line([W(u0-gap/2,Z0+.05),W(u0-gap/2,Z1-.05)],'ghost',.6,{tone:.3,dash:[3,4]});
      const m=day.price_move_pct;
      text(pen,'DAY '+(d+1)+(m>=0?' +':' ')+m.toFixed(2)+'%',W(u0+.06,Z1-.06),6.5,{wall:'i',tone:.7,w:.8});
    });
    text(pen,'THE SAME FOUR DAYS, EVERY GENERATION',pen.wallQuad('i',U0,3.34,.01,.01,.07)[0],7,{wall:'i',tone:.55,w:.8});
    // wing signs under the screen
    text(pen,'REAL',pen.wallQuad('i',1.2,.92,.01,.01,.08)[0],18,{wall:'i',ink:'cyan',w:1.5});
    text(pen,'SCRAMBLED',pen.wallQuad('i',5.95,.92,.01,.01,.08)[0],15,{wall:'i',ink:'magenta',w:1.4});
    // the tote on the side wall
    if(f){const tote=pen.wallQuad('j',1.2,.35,3.4,2.05,.07);pen.shape(tote,['slate',.18],{w:1.3});
      const line=(s,z,ink,size)=>text(pen,s,pen.wallQuad('j',4.45,z,.01,.01,.14)[0],size,{wall:'j',ink,tone:.95,w:1.2});
      line('GEN '+S3(f.generation),2.25,'ghost',15);
      line('KEPT '+f.tribes.real.survived+' OF '+RUN.population,1.55,'ghost',11);
      line('OUT '+(f.tribes.real.eliminated+f.tribes.scrambled.eliminated),1.02,'ghost',11)}
    pen.rug(4.5,2.6,1,5.2,{ink:'slate',tone:.12,border:'slate'});
    // the desks: 25 per wing, four traders each. A trader eliminated this generation is dim.
    const desks=[];
    for(const [tribe,i0] of[['real',.75],['scrambled',5.75]])for(let c=0;c<5;c++)for(let r=0;r<5;r++)
      desks.push({tribe,i:i0+c*.72,j:2.9+r*.95,n:(c*5+r)*4});
    desks.sort((a,b)=>(a.i+a.j)-(b.i+b.j));
    // Selection: while the generation trades (SEL 0) every trader looks alike; as it is judged

    for(const d of desks){
      const rows=f?f.tribes[d.tribe].flies:[],ink=TRIBE_INK[d.tribe];
      const seats=[0,1,2,3].map(k=>rows[d.n+k]).filter(Boolean),kept=seats.filter(s=>!s.eliminated).length;
      const box=pen.box(d.i,d.j,0,.5,.34,.28,{ink:'slate',tone:.4,w:.6,shadow:true});
      if(kept&&SEL>0){pen.tint(box.top,ink,.45*SEL*kept/4);const [gx,gy]=p(d.i+.25,d.j+.17,.3);pen.halo(gx,gy,16*SEL,ink,.35*SEL*kept/4)}
      const [x0,y0]=p(d.i+.25,d.j+.17,.3);
      [[-9,-5],[9,-5],[-9,6],[9,6]].forEach(([dx,dy],k)=>{
        const fly=rows[d.n+k];if(!fly)return;
        const phase=d.n+k+(d.tribe==='real'?0:.5);
        if(fly.eliminated){const drop=easeIn(SEL)*30,side=(k%2?1:-1)*6*SEL;
          if(SEL<.999)pen.minifly(x0+dx+side,y0+dy-6+drop,1.05,ink,lerp(.9,.25,SEL),t*(1-SEL),phase);
          else pen.deadfly(x0+dx+side,y0+dy+24,.8,ink,.22,phase)}
        else pen.minifly(x0+dx,y0+dy-6-3*SEL,1.05+.15*SEL,ink,1,t,phase);
      });

    const walk=(t*.12)%1,jj=3+Math.abs(walk*2-1)*4.2;

   What a fly is actually shown: the last 64 bars, thrown onto its own compound eye. */
room({id:'eye',col:2,row:2,w:8,d:7,h:3.4,
  style:{floor:['slate',.28],wall:['slate',.1],wall2:['slate',.13],planks:false},
  draw(pen,t,R){
    const p=pen.p,day=(RUN.windows&&RUN.windows[0])||null,bars=(day&&day.candles)||[];

         pen.wallQuad('i',.55,2.54,.01,.01,.06)[0],6.4,{wall:'i',tone:.6});
    text(pen,'THE SAME EYE FOR BOTH TRIBES',pen.wallQuad('i',.55,2.3,.01,.01,.06)[0],6,{wall:'i',tone:.45});

    /* the eye: a hex field. A cell lights when the chart passes over its column, so the
       firing pattern is the candles' own shape and not an animation invented here. */
    const cx=3.9,cy=3.1,rows=9,lit=[];
    for(let r=0;r<rows;r++){
      const cols=rows-Math.abs(r-((rows-1)/2|0))-1;
      for(let c=0;c<cols;c++){
        const i=cx-cols*.33+c*.66+(r%2)*.16, j=cy+(r-rows/2)*.52, z=1.9+Math.cos((r-rows/2)/rows*2.2)*.45;
        const u=clamp((c+.5)/cols,0,1);
        const bar=bars.length?bars[Math.min(bars.length-1,Math.floor(u*bars.length))]:null;
        let on=0;
        if(bar){
          const lo=Math.min(...bars.map(q=>q[2])),hi=Math.max(...bars.map(q=>q[1]));
          const h=(bar[3]-lo)/Math.max(1e-9,hi-lo);              // this bar's close, 0..1 up the eye
          const mine=1-(r+.5)/rows;
          on=Math.max(0,1-Math.abs(h-mine)*7);
        }
        const fire=on*(.55+.45*Math.sin(t*3+r*.7+c*.4));
        pen.shape(ellipse2(...p(i,j,z),17,13,0,6),['cyan',.06+fire*.8],{w:1,line:'cyan',lineTone:.45});
        if(fire>.5)lit.push(p(i,j,z));
      }
    }
    for(const q of lit)pen.halo(q[0],q[1],13,'cyan',.26);
    pen.glow(cx,cy,1.4,3.2,'cyan',.10);

    // the projector throwing the chart, and the chart itself on the side wall
    pen.box(.7,5.9,0,.6,.5,.5,{ink:'slate',tone:.4});
    pen.line([p(1.2,5.8,.5),p(cx-.9,cy+.5,1.4)],'ghost',1,{tone:.3,amp:1.2});
    pen.shape(pen.wallQuad('j',.7,.75,3.1,1.25,.05),['slate',.1],{w:1});
    if(bars.length){
      const lo=Math.min(...bars.map(q=>q[2])),hi=Math.max(...bars.map(q=>q[1]));
      bars.forEach((b,k)=>{
        const u=.85+k/bars.length*2.8, Z=v=>.9+(v-lo)/Math.max(1e-9,hi-lo)*.95;
        pen.line([pen.wallQuad('j',u,Z(b[2]),.01,.01,.05)[0],pen.wallQuad('j',u,Z(b[1]),.01,.01,.05)[0]],
                 b[3]>=b[0]?'cyan':'magenta',1.1,{tone:.55,amp:.15});
      });
    }
    text(pen,'64 BARS, SCALED TO THEMSELVES',pen.wallQuad('j',3.9,.5,.01,.01,.05)[0],6,{wall:'j',tone:.5});
    pen.fly(6.6,5.7,0,{t,pose:'hover',ink:'slate',scale:1.2,facing:-1,phase:1.3});
    pen.lamp(7.3,1.2,{t});
  }});

/* =====================  THE SWITCHBOARD  =====================
   The genome: every number a fly inherits, and the handful a child had changed. */
room({id:'switchboard',col:3,row:2,w:9,d:7,h:3.2,
  style:{floor:['slate',.28],wall:['slate',.1],wall2:['slate',.13],planks:false},
  draw(pen,t,R){
    const p=pen.p,size=RUN&&RUN.run?RUN.run.genome_size:null,f=F();
    text(pen,'THE SWITCHBOARD',pen.wallQuad('i',.55,2.74,.01,.01,.06)[0],14,{wall:'i',w:1.3});
    if(size)text(pen,size.toLocaleString('en-US')+' DIALS ON EVERY FLY',pen.wallQuad('i',.55,2.4,.01,.01,.06)[0],6.6,{wall:'i',tone:.65,ink:'gold'});
    text(pen,'ENCODER GAINS AND READOUT WEIGHTS.',pen.wallQuad('i',.55,2.16,.01,.01,.06)[0],5.8,{wall:'i',tone:.45});
    text(pen,'THE WIRING NEVER MOVES.',pen.wallQuad('i',.55,1.96,.01,.01,.06)[0],5.8,{wall:'i',tone:.45});

    /* The panel stands for the genome: rows x cols = the dial count the run logged, drawn at a
       readable density. Which dials flicker is this room's own seeded scatter, redrawn each
       generation - it shows THAT a child differs in a few places, never by how much. */
    const cols=44,rows=size?Math.max(1,Math.round(size/cols)):24;
    const S=stream('switchboard',GEN);
    const changed=new Set();
    for(let k=0;k<26;k++)changed.add(randi(S,0,cols*rows-1));
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const idx=r*cols+c;if(size&&idx>=size)continue;
      const i=.6+c*.175, z=2.6-r*.082;
      const hot=changed.has(idx);
      const fl=hot?(.35+.65*Math.abs(Math.sin(t*5+idx))):0;
      pen.tint(pen.wallQuad('j',i,z,.11,.05,.05),hot?'gold':'slate',hot?.35+fl*.6:.20);
    }

/* =====================  THE SIX-MONTH CORRIDOR  =====================
   The champion walking the locked test end to end, its equity trailing behind it. */
room({id:'corridor',col:2,row:3,w:12,d:5,h:3,
  style:{floor:['slate',.26],wall:['slate',.1],wall2:['slate',.12],planks:true},
  draw(pen,t,R){
    const p=pen.p,fin=RUN&&RUN.finale;

    const champ=fin.passes.with_fees.traders.real_champions;
    const curve=champ&&champ.curve||[];

    // a door for every month the locked set spans, from the finale's own dates
    const A=new Date(fin.first_time),B=new Date(fin.last_time);
    const months=Math.max(1,Math.round((B-A)/(1000*60*60*24*30.44)));
    const NAMES=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    for(let m=0;m<months;m++){
      const i=.9+m*(10.4/months);
      pen.shape([p(i,.12,0),p(i+1.3,.12,0),p(i+1.3,.12,1.9),p(i,.12,1.9)],['slate',.1],{w:1,line:'ghost',lineTone:.35});
      text(pen,NAMES[(A.getUTCMonth()+m)%12],pen.wallQuad('i',i+.28,2.06,.01,.01,.11)[0],7,{wall:'i',tone:.55});
    }

    /* the equity trail: the champions' logged curve, drawn along the corridor as far as the
       walker has got. The walk loops on the room clock; the line is the finale's. */
    const u=(t*.07)%1, upto=Math.max(2,Math.floor(curve.length*u));
    const lo=Math.min(...curve),hi=Math.max(...curve);
    const X=k=>.8+k/Math.max(1,curve.length-1)*10.6, Z=v=>.35+(v-lo)/Math.max(1e-9,hi-lo)*1.25;

    const trail=[];for(let k=0;k<upto;k++)trail.push(p(X(k),2.5,Z(curve[k])));
    if(trail.length>1)pen.line(trail,'cyan',1.8,{amp:.2});
    const here=trail[trail.length-1];
    if(here){pen.halo(here[0],here[1],9,'cyan',.5);
      text(pen,money(curve[upto-1]),[here[0]+14,here[1]-14],9,{ink:'cyan',w:1.2});}

    // the champion, walking it
    pen.fly(.8+u*10.6,3.3,.05+Math.abs(Math.sin(t*4))*.12,
            {t,pose:'hover',ink:'cyan',scale:1.5,facing:1,phase:.2,glowStrength:1.1,noShadow:true});

         pen.wallQuad('j',4.6,.42,.01,.01,.05)[0],6,{wall:'j',tone:.6,ink:'cyan'});
    pen.lamp(11.3,1.2,{t});
  }});

/* =====================  THE OVERLAY  =====================

const buildingBounds=()=>ROOMS.reduce((a,r)=>[Math.min(a[0],r.bounds[0]),Math.min(a[1],r.bounds[1]),Math.max(a[2],r.bounds[2]),Math.max(a[3],r.bounds[3])],[1e9,1e9,-1e9,-1e9]);
function overlay(pen,t,a,b){
  if(!RUN)return;
  const B=buildingBounds(),cx=(B[0]+B[2])/2,S=stream('stars');
  for(let k=0;k<220;k++){const x=lerp(B[0]-420,B[2]+420,S()),y=lerp(B[1]-520,B[3]+260,S()),r=rand(S,.6,1.8),ph=rand(S,0,TAU);
    if(x<a.x||x>b.x||y<a.y||y>b.y)continue;
    if(ROOMS.some(q=>x>q.bounds[0]&&x<q.bounds[2]&&y>q.bounds[1]&&y<q.bounds[3]))continue;
    pen.dot(x,y,r,'ghost',.25+.35*(.5+.5*Math.sin(t*1.3+ph)))}
  textCentred(pen,'NATURAL SELECTION CAPITAL',[cx,B[1]-190],68,{w:5,gap:.3,amp:.5});
  textCentred(pen,'HQ · WHERE A HUNDRED FRUIT-FLY BRAINS TRADE BITCOIN',[cx,B[1]-82],20,{ink:'gold',w:2,tone:.9});
  if(CAM_MODE==='hero'&&HERO_POS){
    heroTrail.push([HERO_POS.x,HERO_POS.y]);if(heroTrail.length>28)heroTrail.shift();
    for(let k=1;k<heroTrail.length;k++)pen.line([heroTrail[k-1],heroTrail[k]],'gold',1.4,{tone:.6*k/heroTrail.length,amp:0});
    const hp=makePen(pen.ctx,{ox:HERO_POS.x,oy:HERO_POS.y,boil:pen.boil}),h=hero('real');
    hp.fly(0,0,0,{t,scale:1.7,ink:'gold',pose:'hover',noShadow:true,glowStrength:1.8,facing:HERO_POS.dir,phase:.3});
    if(h)text(pen,h.id+' · HERO CAM',[HERO_POS.x+22,HERO_POS.y-60],9,{ink:'gold',w:1})}
}

/* =====================  PLAYBACK  =====================
   A generation trades, then is judged: SEL runs 0 to 1 over the back half of each generation,
   while the eliminated fall, the survivors light up and the children hatch. The camera tours
   shot by shot - a room, then sometimes a push in on its detail - or follows the hero, or
   pulls back to the whole building. Everything runs on NOW(), so the recorder can step it. */
const MS_PER_GEN=3600,SEL_FROM=.45,SHOT_MS=4400,HERO_LEG_MS=5200,HERO_ZOOM=2.3;
const ROOM_ORDER=['street','lab','server','brain','eye','floor','pile','nursery','switchboard',
                 'hero','gallery','archive','overfit','toll','model','corridor','boardroom','vault'];
const SHOTS=[{room:'lab'},{room:'lab',focus:[4.9,3.2,1.0],zoom:2.4},{room:'brain'},{room:'floor'},
  {room:'floor',focus:[5,.2,2.3],zoom:1.9},{room:'pile'},{room:'nursery'},{room:'hero'},
  {room:'hero',focus:[3.3,4.6,1.3],zoom:2.5},{room:'archive'},{room:'overfit'},{room:'model'},
  {room:'model',focus:[3.3,4.5,1.7],zoom:2.3},{room:'vault'}];
const NAMES={lab:'lab',brain:'brain',floor:'floor',pile:'pile',nursery:'nursery',hero:"hero's desk",
             archive:'archive',overfit:'overfit',model:'model',vault:'vault'};
const DRIVEN=()=>!!window.__HEDGEFLY_VCLOCK_DRIVEN__;
let CAM_MODE='tour',genStart=0,shotStart=0,shotIndex=-1,heroStart=0,HERO_POS=null,heroTrail=[];
let REPLY=-1;                                    // which of the model's logged replies is on the wall; -1 = its last
const ui={play:document.getElementById('play'),scrub:document.getElementById('scrub'),label:document.getElementById('label'),
          stat:document.getElementById('stat'),rooms:document.getElementById('rooms'),terminal:document.getElementById('terminal'),
          inset:document.getElementById('inset'),building:document.getElementById('building'),herocam:document.getElementById('herocam')};
const roomById=id=>ROOMS.find(r=>r.id===id);
function light(id){for(const b of ui.rooms.children)b.classList.toggle('on',b.dataset.room===id);
  ui.building.classList.toggle('on',CAM_MODE==='building');ui.herocam.classList.toggle('on',CAM_MODE==='hero')}
function shotTarget(s){const r=roomById(s.room),base=framing(r.bounds);if(!s.focus)return base;
  const [x,y]=iso(r.oi+s.focus[0],r.oj+s.focus[1],s.focus[2]);return {x,y,zoom:clamp(base.zoom*s.zoom,MIN_Z,MAX_Z)}}
function jump(target,ms){if(ms<=0){Object.assign(cam,target);camBase={...target};tween=null;lastCam=''}else flyTo(target,ms)}
function goShot(k,ms=2600){CAM_MODE='tour';shotIndex=(k+SHOTS.length)%SHOTS.length;shotStart=NOW();jump(shotTarget(SHOTS[shotIndex]),ms);light(SHOTS[shotIndex].room)}
function goToRoom(id,ms=1400){const r=roomById(id);if(!r)return;CAM_MODE='free';jump(framing(r.bounds),ms);light(id)}
function building(ms=2800){CAM_MODE='building';const B=buildingBounds();
  jump(framing([B[0]-60,B[1]-260,B[2]+60,B[3]+40]),ms);light(null)}
function heroCam(){CAM_MODE='hero';heroStart=NOW();heroTrail=[];tween=null;light(null)}
function heroCamTarget(){return CAM_MODE==='hero'&&HERO_POS?{x:HERO_POS.x,y:HERO_POS.y-26,zoom:HERO_ZOOM}:null}
function anchor(id){const r=roomById(id);const [x,y]=iso(r.oi+r.w/2,r.oj+r.d/2,1.9);return {x,y}}
function updateHero(now){
  const el=now-heroStart,n=ROOM_ORDER.length,k=Math.floor(el/HERO_LEG_MS)%n,u=(el%HERO_LEG_MS)/HERO_LEG_MS;
  const A=anchor(ROOM_ORDER[k]),Bp=anchor(ROOM_ORDER[(k+1)%n]),fly=.6;
  if(u<fly){const e=ease(u/fly);HERO_POS={x:lerp(A.x,Bp.x,e),y:lerp(A.y,Bp.y,e)-80*Math.sin(Math.PI*e),dir:Bp.x>=A.x?1:-1}}
  else HERO_POS={x:Bp.x,y:Bp.y+Math.sin(now/300)*4,dir:HERO_POS?HERO_POS.dir:1};
}
function paint(){
  if(!RUN)return;const f=F(),real=f.tribes.real,scr=f.tribes.scrambled,bh=RUN.competitor_results.buy_and_hold;
  ui.scrub.value=GEN;ui.label.textContent=`generation ${f.generation} / ${RUN.generations-1}`;
  ui.stat.innerHTML=`<span class="real">real</span> best ${money(real.equity.best)} · median ${money(real.equity.median)} &nbsp;|&nbsp; `+
    `<span class="scr">scrambled</span> best ${money(scr.equity.best)} · median ${money(scr.equity.median)} &nbsp;|&nbsp; `+
    `buy &amp; hold ${money(bh.final_equity)} &nbsp;|&nbsp; ${fallen().toLocaleString('en-US')} eliminated so far`+
    (real.validation?` &nbsp;|&nbsp; validation median real ${money(real.validation.equity.median)} · scrambled ${money(scr.validation.equity.median)}`:'')+
    (RUN.fake?' &nbsp;·&nbsp; FAKE DATA':'');
  ui.play.textContent=PLAYING?'pause':'play';lastCam='';
  const frame=ui.inset.querySelector('iframe');
  if(ui.inset.classList.contains('open')&&frame.contentWindow)frame.contentWindow.postMessage({hedgefly:'gen',gen:GEN},'*');
}
function setGeneration(g){if(!RUN)return;GEN=clamp(Math.round(g),0,RUN.generations-1);paint()}
function tickOnce(now){
  if(PLAYING&&RUN){
    if(now-genStart>=MS_PER_GEN){genStart=now;setGeneration(GEN+1>=RUN.generations?0:GEN+1)}
    const ph=(now-genStart)/MS_PER_GEN;SEL=ph<SEL_FROM?0:clamp((ph-SEL_FROM)/(.95-SEL_FROM),0,1);
    if(CAM_MODE==='tour'&&now-shotStart>=SHOT_MS&&!tween)goShot(shotIndex+1);
  }
  if(CAM_MODE==='hero')updateHero(now);
}
function tick(){if(!DRIVEN())requestAnimationFrame(tick);tickOnce(NOW())}
function openTerminal(on){
  ui.inset.classList.toggle('open',on);ui.terminal.classList.toggle('on',on);
  const frame=ui.inset.querySelector('iframe');
  if(on&&!frame.dataset.loaded){frame.dataset.loaded='1';frame.onload=()=>paint();
    if(window.__HEDGEFLY_TERMINAL__)
      frame.srcdoc=window.__HEDGEFLY_TERMINAL__.replace('<'+'!--HEDGEFLY-DATA--'+'>',
        '<'+'script>window.__HEDGEFLY_RUN__='+JSON.stringify(RUN).replace(/</g,'\\u003c')+';<'+'/script>');
    else frame.src='../terminal/index.html?data='+encodeURIComponent(qs.get('data')||'../hq/runs.json')}
}
function wireUI(){
  ui.play.onclick=()=>{PLAYING=!PLAYING;genStart=NOW();if(PLAYING&&CAM_MODE==='free')goShot(shotIndex+1);paint()};
  ui.scrub.oninput=e=>{PLAYING=false;SEL=1;setGeneration(+e.target.value)};
  ui.terminal.onclick=()=>openTerminal(!ui.inset.classList.contains('open'));
  ui.building.onclick=()=>building();
  ui.herocam.onclick=()=>CAM_MODE==='hero'?goShot(shotIndex+1):heroCam();
  for(const id of ROOM_ORDER){const b=document.createElement('button');b.textContent=NAMES[id];b.dataset.room=id;
    b.onclick=()=>goToRoom(id);ui.rooms.appendChild(b)}
  addEventListener('keydown',e=>{
    if(e.key===' '){ui.play.onclick();e.preventDefault()}
    else if(e.key==='['){PLAYING=false;SEL=1;setGeneration(GEN-1)}
    else if(e.key===']'){PLAYING=false;SEL=1;setGeneration(GEN+1)}
    else if(e.key==='t')openTerminal(!ui.inset.classList.contains('open'));
    else if(e.key==='b')building();
    else if(e.key==='y')ui.herocam.onclick();
    else director(e);
  });
  buildLegend();
}
/* =====================================================================
   DIRECTOR MODE - record by hand, with the camera on the keyboard.
   Every key here only moves the camera or the generation pointer; none of them can change a
   number, so a hand-recorded take shows exactly what an automatic one would.
   ===================================================================== */
const DIRECTOR=[
  ['1 - 9, 0','the first ten rooms'],
  [', .','the room before / after (all '+0+')'],
  ['\u2190 \u2191 \u2193 \u2192','pan       (also W A S D)'],
  ['+  -','zoom in / out'],
  ['[  ]','a generation back / on'],
  ['SPACE','play / pause'],
  ['SHIFT (hold)','slow motion, and fine pan'],
  ['B  Y  T','building / hero cam / terminal'],
  ['H','hide everything for a clean take'],
  ['F','fullscreen'],
  ['P','save this frame as a png'],
];
function buildLegend(){
  DIRECTOR[1][1]='the room before / after (all '+ROOM_ORDER.length+')';
  const el=document.getElementById('legend');if(!el)return;
  el.innerHTML=DIRECTOR.map(([k,what])=>`<b>${k}</b><span>${what}</span>`).join('');
}
function hideAll(on){
  document.body.classList.toggle('clean',on);
  document.body.classList.toggle('hidden-ui',on);
}
function director(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  const digits='1234567890';
  if(digits.includes(k)&&ROOM_ORDER.length){
    const idx=(digits.indexOf(k));if(idx<ROOM_ORDER.length){goToRoom(ROOM_ORDER[idx],700);e.preventDefault()}return;
  }
  if(k===','||k==='.'){
    const here=ROOMS.find(r=>r.id&&document.querySelector(`#rooms button[data-room="${r.id}"].on`));
    let i=here?ROOM_ORDER.indexOf(here.id):0;
    i=(i+(k==='.'?1:-1)+ROOM_ORDER.length)%ROOM_ORDER.length;
    goToRoom(ROOM_ORDER[i],700);e.preventDefault();return;
  }
  if(k==='h'||k==='H'){hideAll(!document.body.classList.contains('hidden-ui'));e.preventDefault();return}
  if(k==='f'||k==='F'){
    if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
    e.preventDefault();return;
  }
}
// slow motion lives on the shift key, held: the world eases, and the pan step shrinks with it
addEventListener('keydown',e=>{if(e.key==='Shift')RATE=.25});
addEventListener('keyup',e=>{if(e.key==='Shift')RATE=1});
addEventListener('blur',()=>{RATE=1});

async function loadRun(){
  if(window.__HEDGEFLY_RUN__)return window.__HEDGEFLY_RUN__;
  const r=await fetch(qs.get('data')||'../hq/runs.json',{cache:'no-store'});
  if(!r.ok)throw new Error('runs.json: '+r.status);
  return r.json();
}
/* The recorder's handle (scripts/record_hq.mjs): step the clock, pick a shot, set the story. */
window.__hedgefly={ready:false,
  step(ms){window.__HEDGEFLY_VCLOCK__=(window.__HEDGEFLY_VCLOCK__||0)+ms;tickOnce(NOW());stepFrame()},
  shot(kind,arg,ms=0){if(kind==='tour')goShot(arg||0,ms);else if(kind==='room')goToRoom(arg,ms);
    else if(kind==='focus')goShot(SHOTS.findIndex(s=>s.room===arg&&s.focus),ms);
    else if(kind==='building')building(ms);else if(kind==='hero')heroCam()},
  play(on){PLAYING=on;genStart=NOW()},gen(g){setGeneration(g)},sel(s){SEL=s},open(o){OPEN=o},
  reply(i){REPLY=i},
  // a shot that moves by itself: the recorder sets the camera every frame instead of tweening to it
  cam(x,y,zoom){CAM_MODE='free';tween=null;camBase={x,y,zoom:clamp(zoom,MIN_Z,MAX_Z)};
    cam.x=camBase.x;cam.y=camBase.y;cam.zoom=camBase.zoom;lastCam=''},
  frame(id){const r=roomById(id);return r?framing(r.bounds):null},
  spot(id,i,j,z=0){const r=roomById(id);if(!r)return null;const [x,y]=iso(r.oi+i,r.oj+j,z);return {x,y}},
  replies(){const f=RUN&&RUN.finale,l=f&&f.passes.with_fees.traders.llm;return l&&l.replies?l.replies.last.length:0},
  rooms:()=>ROOM_ORDER.slice(),hasFinale:()=>!!(RUN&&RUN.finale),generations:()=>RUN?RUN.generations:0};
async function boot(){
  if(qs.has('vertical'))document.body.classList.add('vertical');
  if(qs.has('clean')||qs.has('record'))document.body.classList.add('clean');
  try{RUN=await loadRun()}catch(e){console.error(e);ui.stat.textContent='no run data: serve visuals/ over http, or open visuals/dist/hedgefly.html';return}
  if(!(RUN.contract_version>=2)){ui.stat.textContent=`this page reads data contract v2 or later; the file is v${RUN.contract_version||1}`;return}
  ui.scrub.max=RUN.generations-1;
  GEN=clamp(+(qs.get('gen')||0),0,RUN.generations-1);
  PLAYING=qs.get('play')!=='0'&&!qs.has('still')&&!qs.has('record');
  SEL=qs.has('sel')?+qs.get('sel'):(PLAYING?0:1);OPEN=qs.has('open')?+qs.get('open'):1;
  wireUI();paint();start();
  const first=qs.get('room'),mode=qs.get('cam');
  if(mode==='building')building(0);else if(mode==='hero')heroCam();
  else if(first)goToRoom(first,0);else if(PLAYING)goShot(0,0);
  if(qs.has('terminal'))openTerminal(true);
  if(qs.has('record'))idleSince=-1e9;              // a recording drifts from its first frame
  genStart=NOW();window.__hedgefly.ready=true;
  if(!DRIVEN())requestAnimationFrame(tick);
}
boot();
</script>
</body></html>
