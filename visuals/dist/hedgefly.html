window.__HEDGEFLY_TERMINAL__="\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Fly Terminal — Natural Selection Capital\u003c/title>\n\u003cstyle>\n  :root{\n    --void:#06080c; --panel:#0b0f16; --grid:#16202e;\n    --real:#2ff5c8; --scrambled:#ff3d7f; --hero:#ffd23f;\n    --up:#1f9e6e; --down:#b3335c; --ink:#c9d6e6; --dim:#5a6b80; --locked:#ff6a1f;\n    --mono:ui-monospace,\"SF Mono\",\"JetBrains Mono\",Menlo,Consolas,monospace;\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;overflow:hidden;background:var(--void);color:var(--ink);\n    font-family:var(--mono);font-variant-numeric:tabular-nums}\n  #screen{position:fixed;inset:0;width:100%;height:100%;display:block}\n  #ui{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:14px;\n    padding:0 16px;background:linear-gradient(to top,rgba(6,8,12,.98),rgba(6,8,12,.72));\n    border-top:1px solid var(--grid);font-size:12px;letter-spacing:.12em;text-transform:uppercase;\n    user-select:none}\n  #ui button{font:inherit;letter-spacing:.12em;text-transform:uppercase;color:var(--real);\n    background:transparent;border:1px solid var(--real);padding:5px 14px;cursor:pointer;\n    min-width:82px}\n  #ui button:hover{background:rgba(47,245,200,.12)}\n  #scrub{flex:1;-webkit-appearance:none;appearance:none;height:3px;background:var(--grid);outline:none}\n  #scrub::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:18px;background:var(--hero);\n    cursor:pointer;border:0}\n  #scrub::-moz-range-thumb{width:12px;height:18px;background:var(--hero);cursor:pointer;border:0}\n  #gen{color:var(--dim);min-width:150px}\n  #gen b{color:var(--ink);font-weight:400}\n  body.vertical #ui{height:52px}\n  #boot{position:fixed;inset:0;display:grid;place-items:center;color:var(--dim);font-size:13px;\n    letter-spacing:.14em;text-transform:uppercase}\n\u003c/style>\n\u003c/head>\u003cbody>\n\u003ccanvas id=\"screen\" aria-label=\"Fly Terminal: two tribes of fruit-fly brains trading Bitcoin\">\u003c/canvas>\n\u003cdiv id=\"boot\">loading runs.json…\u003c/div>\n\u003cdiv id=\"ui\" hidden>\n  \u003cbutton id=\"play\">pause\u003c/button>\n  \u003cinput id=\"scrub\" type=\"range\" min=\"0\" max=\"0\" value=\"0\" step=\"1\" aria-label=\"generation\">\n  \u003cspan id=\"gen\">\u003c/span>\n\u003c/div>\n\u003c!--HEDGEFLY-DATA-->\n\u003cscript>\n'use strict';\n/* =====================================================================\n   FLY TERMINAL — visuals/style.md. Reads visuals/hq/data-contract.md,\n   the same runs.json the riso HQ replays. No dependencies.\n   ===================================================================== */\nconst C = {\n  void:'#06080c', panel:'#0b0f16', grid:'#16202e',\n  real:'#2ff5c8', scrambled:'#ff3d7f', hero:'#ffd23f',\n  up:'#1f9e6e', down:'#b3335c', ink:'#c9d6e6', dim:'#5a6b80', locked:'#ff6a1f',\n};\nconst TRIBE_COLOR = {real:C.real, scrambled:C.scrambled};\nconst qs = new URLSearchParams(location.search);\nconst VERTICAL = qs.has('vertical');\nconst MS_PER_GEN = 1100;\nconst PILE_MAX = 4000;            // drawn eliminated flies; the count keeps rising past this\nconst TRAIL = 40;\n\nconst cv = document.getElementById('screen');\nconst ctx = cv.getContext('2d', {alpha:false});\nlet W=1, H=1, dpr=1;\nlet RUN=null, GEN=0, PLAYING=true, lastTick=0, t0=performance.now();\n\n/* ---------- seeded noise: the same generation always looks the same ---------- */\nconst mulberry=a=>()=>{a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;\n  return((x^x>>>14)>>>0)/4294967296};\nconst seeded=n=>mulberry((n+1)*0x9E3779B9>>>0);\nconst clamp=(v,a,b)=>v\u003ca?a:v>b?b:v;\nconst lerp=(a,b,u)=>a+(b-a)*u;\nconst money=v=>'$'+Math.round(v).toLocaleString('en-US');\n\n/* ---------- the frame we are showing ---------- */\nconst frame=()=>RUN.frames[clamp(GEN,0,RUN.frames.length-1)];\nconst heroOf=tribe=>frame().heroes[tribe];\n\n/* ---------- candles ----------------------------------------------------------\n   The real bars the generation traded, as [open, high, low, close], from the exporter\n   (visuals/hq/data-contract.md). No candles in the file means no candles on screen: this\n   never invents a shape.                                                                  */\nfunction candlesFor(day){\n  const raw=day&&day.candles;\n  return raw&&raw.length ? raw.map(([o,h,l,c])=>({o,h,l,c})) : null;\n}\nconst days=()=>RUN.windows||[];\n\n/* ---------- layout: one grid, two arrangements, never two implementations ---------- */\nfunction layout(){\n  const pad=12, ui=VERTICAL?52:46, h=H-ui;\n  if(VERTICAL){\n    const world={x:pad,y:pad+34,w:W-pad*2,h:h*0.50};\n    const pile={x:pad,y:world.y+world.h+8,w:W-pad*2,h:h*0.11};\n    const row=pile.y+pile.h+10, rest=h-row-pad;\n    const half=(W-pad*2-8)/2;\n    return {head:{x:pad,y:pad,w:W-pad*2,h:30}, world, pile,\n      score:{x:pad,y:row,w:W-pad*2,h:rest*0.44},\n      mesh:{x:pad,y:row+rest*0.44+8,w:half,h:rest*0.56-8},\n      locked:{x:pad+half+8,y:row+rest*0.44+8,w:half,h:rest*0.56-8}};\n  }\n  const side=Math.min(330,Math.max(250,W*0.24));\n  const left=W-side-pad*3, lx=pad;\n  const world={x:lx,y:pad+34,w:left,h:h-pad*2-34-86};\n  return {head:{x:lx,y:pad,w:left,h:30}, world,\n    pile:{x:lx,y:world.y+world.h+8,w:left,h:78},\n    score:{x:W-side-pad,y:pad,w:side,h:(h-pad*2)*0.46},\n    mesh:{x:W-side-pad,y:pad+(h-pad*2)*0.46+10,w:side,h:(h-pad*2)*0.32-10},\n    locked:{x:W-side-pad,y:pad+(h-pad*2)*0.78+10,w:side,h:(h-pad*2)*0.22-10}};\n}\n\n/* ---------- marks ---------- */\nfunction glowPath(color, blur, draw, {fill=true, width=1}={}){\n  ctx.save();\n  ctx.shadowColor=color; ctx.shadowBlur=blur;\n  ctx.fillStyle=color; ctx.strokeStyle=color; ctx.lineWidth=width;\n  ctx.beginPath(); draw(); fill?ctx.fill():ctx.stroke();\n  ctx.shadowBlur=0;                                  // the sharp pass over the soft one\n  ctx.beginPath(); draw(); fill?ctx.fill():ctx.stroke();\n  ctx.restore();\n}\nfunction label(s,x,y,{color=C.dim,size=11,align='left',spacing=1.6}={}){\n  ctx.save();\n  ctx.fillStyle=color;\n  ctx.font=`${size}px ui-monospace,Menlo,Consolas,monospace`;\n  ctx.letterSpacing=`${spacing}px`;                  // one tracked run, not hand-placed glyphs\n  ctx.textAlign=align==='right'?'right':align==='center'?'center':'left';\n  ctx.textBaseline='alphabetic';\n  const text=String(s).toUpperCase();\n  ctx.fillText(text,x,y);\n  const w=ctx.measureText(text).width;\n  ctx.restore(); return w;\n}\nfunction value(s,x,y,{color=C.ink,size=13,align='left'}={}){\n  ctx.save(); ctx.fillStyle=color; ctx.font=`${size}px ui-monospace,Menlo,monospace`;\n  ctx.textAlign=align; ctx.textBaseline='alphabetic'; ctx.fillText(String(s),x,y); ctx.restore();\n}\nfunction pane(r,title,{color=C.grid, titleColor=C.dim}={}){\n  ctx.fillStyle=C.panel; ctx.fillRect(r.x,r.y,r.w,r.h);\n  ctx.strokeStyle=color; ctx.lineWidth=1; ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1);\n  if(title) label(title, r.x+10, r.y+16, {color:titleColor});\n}\n\n/* ---------- the world: candles ---------- */\nlet chartCanvas=null, chartKey='';\n/* The four fixed days, side by side. Each day is scaled to its own high and low, the way the\n   flies see a chart, because four days at different prices on one axis would flatten all four.\n   The days never change, so this is drawn once per size, not once per generation.            */\nfunction chartLayer(r){\n  const key=`${Math.round(r.w)}x${Math.round(r.h)}`;\n  if(chartKey===key) return chartCanvas;\n  const cc=chartCanvas||document.createElement('canvas');\n  cc.width=Math.max(1,Math.round(r.w*dpr)); cc.height=Math.max(1,Math.round(r.h*dpr));\n  const g=cc.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);\n  g.clearRect(0,0,r.w,r.h);\n  const all=days(), gap=10, dw=(r.w-gap*(all.length-1))/Math.max(1,all.length);\n  const top=40, bot=r.h-18;\n  g.strokeStyle=C.grid; g.lineWidth=1;\n  for(let k=0;k\u003c=4;k++){const gy=Math.round(top+(bot-top)*k/4)+.5;\n    g.beginPath(); g.moveTo(0,gy); g.lineTo(r.w,gy); g.stroke();}\n  all.forEach((day,d)=>{\n    const x0=d*(dw+gap), bars=candlesFor(day);\n    if(d){ g.strokeStyle=C.dim; g.globalAlpha=.35; g.setLineDash([2,4]);\n      g.beginPath(); g.moveTo(Math.round(x0-gap/2)+.5,8); g.lineTo(Math.round(x0-gap/2)+.5,r.h-8); g.stroke();\n      g.setLineDash([]); g.globalAlpha=1; }\n    if(!bars) return;                                   // nothing in the file, nothing drawn\n    const lo=Math.min(...bars.map(b=>b.l)), hi=Math.max(...bars.map(b=>b.h));\n    const span=Math.max(hi-lo,1e-9), y=v=>bot-(v-lo)/span*(bot-top), bw=dw/bars.length;\n    bars.forEach((b,i)=>{\n      const cx=x0+i*bw+bw/2, col=b.c>=b.o?C.up:C.down;\n      g.strokeStyle=col; g.fillStyle=col; g.lineWidth=1;\n      g.beginPath(); g.moveTo(Math.round(cx)+.5,y(b.h)); g.lineTo(Math.round(cx)+.5,y(b.l)); g.stroke();\n      const yo=y(b.o), yc=y(b.c);\n      g.fillRect(Math.round(cx-bw*0.32), Math.round(Math.min(yo,yc)), Math.max(1,Math.round(bw*0.64)),\n                 Math.max(1,Math.abs(yc-yo)));\n    });\n  });\n  chartCanvas=cc; chartKey=key; return cc;\n}\nfunction dayLabels(r){\n  const all=days(), gap=10, dw=(r.w-gap*(all.length-1))/Math.max(1,all.length);\n  all.forEach((day,d)=>{\n    const x=r.x+d*(dw+gap)+8, m=day.price_move_pct;\n    label(`day ${d+1} · ${day.first_time.slice(0,10)}`, x, r.y+16, {color:C.dim, size:9});\n    label(`${m>=0?'+':''}${m.toFixed(2)}%`, x, r.y+29, {color:m>=0?C.real:C.scrambled, size:9});\n  });\n}\n\n/* ---------- the world: 200 flies ----------------------------------------------\n   A fly's height is how it is doing: the top of the pane is the best equity in either tribe\n   this generation. The fittest fifth fly bright; the eliminated fly dim, because they are\n   about to drop into the pile.                                                               */\nfunction flyState(f, tribe, i, time){\n  const fly=f.tribes[tribe].flies[i];\n  const R=seeded(f.generation*977 + (tribe==='real'?0:5000) + i);\n  const a=R(), b=R(), c=R();\n  return {fly, phase:a*6.283, driftX:b, driftY:c, wing:a*97};\n}\nfunction flyBand(f){\n  /* The pane's height is the spread of the flies that are still flying this generation, so a\n     swarm that is all within a percent of each other still fills the sky. The $1,000 line is\n     drawn where it falls, and above it means winning. */\n  const alive=[];\n  for(const tribe of RUN.tribes)\n    for(const fly of f.tribes[tribe].flies) alive.push(fly.equity);\n  if(!alive.length) return {lo:RUN.start_cash*.98, hi:RUN.start_cash*1.02};\n  // Percentiles, not min and max: one fly clinging on at $505 would otherwise squash the whole\n  // swarm into the top of the pane. Flies outside the band are clamped to its edges.\n  alive.sort((a,b)=>a-b);\n  const q=u=>alive[clamp(Math.round(u*(alive.length-1)),0,alive.length-1)];\n  let lo=q(0.12), hi=q(0.88);\n  if(hi-lo\u003cRUN.start_cash*0.004){ const mid=(hi+lo)/2, half=RUN.start_cash*0.002; lo=mid-half; hi=mid+half; }\n  const pad=(hi-lo)*0.45;\n  return {lo:Math.min(lo-pad,RUN.start_cash), hi:Math.max(hi+pad,RUN.start_cash)};\n}\nfunction drawFlies(r,f,time){\n  const {lo,hi}=flyBand(f);\n  const top=r.y+22, bot=r.y+r.h-26;\n  const yOf=e=>bot-clamp((e-lo)/Math.max(hi-lo,1e-9),0,1)*(bot-top);\n  ctx.save();                                        // the break-even line the swarm sorts around\n  ctx.setLineDash([2,5]); ctx.strokeStyle=C.ink; ctx.globalAlpha=.28; ctx.lineWidth=1;\n  ctx.beginPath(); ctx.moveTo(r.x,yOf(RUN.start_cash)); ctx.lineTo(r.x+r.w,yOf(RUN.start_cash)); ctx.stroke();\n  ctx.restore();\n  label(money(RUN.start_cash)+' break even', r.x+10, yOf(RUN.start_cash)-5, {color:C.dim,size:9});\n  const wings=[];\n  for(const tribe of RUN.tribes){\n    const rows=f.tribes[tribe].flies, col=TRIBE_COLOR[tribe];\n    const lane=tribe==='real'?0:1;\n    const doomed=[], kept=[];\n    for(let i=0;i\u003crows.length;i++){\n      const s=flyState(f,tribe,i,time);\n      const wander=Math.sin(time*0.7+s.phase)*9 + Math.sin(time*0.23+s.phase*1.7)*16;\n      const x=r.x+14+((i+s.driftX*0.8)/rows.length)*(r.w-28) + wander*0.5;\n      const y=yOf(rows[i].equity) + Math.sin(time*1.9+s.phase)*5 + (lane?3:-3);\n      (rows[i].eliminated?doomed:kept).push([x,y,s]);\n    }\n    for(const [bodies,alpha,glow] of [[doomed,.3,0],[kept,1,10]]){\n      ctx.save(); ctx.globalAlpha=alpha;\n      if(glow) glowPath(col, glow, ()=>{ for(const [x,y] of bodies){ ctx.moveTo(x+2.2,y); ctx.arc(x,y,2.2,0,6.283); } });\n      else { ctx.fillStyle=col; ctx.beginPath();\n             for(const [x,y] of bodies){ ctx.moveTo(x+1.8,y); ctx.arc(x,y,1.8,0,6.283); } ctx.fill(); }\n      ctx.globalAlpha=alpha*.6; ctx.strokeStyle=col; ctx.lineWidth=1; ctx.beginPath();\n      for(const [x,y,s] of bodies){                      // wings, redrawn every frame\n        const beat=Math.sin(time*26+s.wing)*2.6;\n        ctx.moveTo(x-1,y-1); ctx.lineTo(x-5,y-3.4-beat);\n        ctx.moveTo(x+1,y-1); ctx.lineTo(x+5,y-3.4+beat);\n      }\n      ctx.stroke(); ctx.restore();\n    }\n  }\n  return {yOf, top, bot};\n}\n\n/* ---------- the pile: every fly selection has eliminated, and it only ever grows ----------\n   A fly eliminated in generation g lands here once generation g is over, so on screen the\n   pile holds generations 0 .. GEN-1 while GEN's losers are still in the air, dimmed.        */\nlet pile=[], pileThrough=-1;\nfunction rebuildPile(upto){\n  pile=[];\n  for(let g=0; g\u003cupto && g\u003cRUN.frames.length; g++){\n    const f=RUN.frames[g];\n    for(const tribe of RUN.tribes){\n      f.tribes[tribe].flies.forEach((fly,i)=>{\n        if(!fly.eliminated) return;\n        const R=seeded(g*7919 + (tribe==='real'?1:2)*131 + i);\n        pile.push({tribe, u:R(), v:R(), born:g});\n      });\n    }\n  }\n  pileThrough=upto;\n}\nfunction drawPile(r){\n  pane(r,null);\n  const total=pile.length;\n  const shown=pile.slice(-PILE_MAX);\n  // the pitch shrinks as the pile grows, so thousands of flies still fit the strip\n  const area=(r.w-14)*(r.h-26), pitch=clamp(Math.sqrt(area/Math.max(1,shown.length))*0.92,2.2,5);\n  const cols=Math.max(8,Math.floor((r.w-14)/pitch)), height=Math.max(1,Math.floor((r.h-26)/pitch));\n  const stack=new Int32Array(cols), rad=pitch*.36;\n  const heap={real:[], scrambled:[]};\n  for(const p of shown){\n    const c=Math.min(cols-1,Math.floor(p.u*cols));\n    const level=stack[c]++;\n    heap[p.tribe].push([r.x+7+c*pitch+pitch/2, r.y+r.h-6-(level%height)*pitch - p.v*0.8]);\n  }\n  for(const tribe of RUN.tribes){\n    ctx.save(); ctx.globalAlpha=.6; ctx.fillStyle=TRIBE_COLOR[tribe]; ctx.beginPath();\n    for(const [x,y] of heap[tribe]){ ctx.moveTo(x+rad,y); ctx.arc(x,y,rad,0,6.283); }\n    ctx.fill(); ctx.restore();\n  }\n  label('the pile · eliminated by selection',r.x+10,r.y+15,{color:C.dim});\n  label(`${total.toLocaleString('en-US')} eliminated`,r.x+r.w-10,r.y+15,{color:total?C.locked:C.dim,align:'right'});\n}\n\n/* ---------- the hero: trail, tag, equity line, family tree ---------- */\nlet trail=[];\nfunction drawHero(r,f,time,scale){\n  const hero=heroOf('real');\n  const rows=f.tribes.real.flies;\n  let best=0; for(let i=1;i\u003crows.length;i++) if(rows[i].equity>rows[best].equity) best=i;\n  const s=flyState(f,'real',best,time);\n  const wander=Math.sin(time*0.7+s.phase)*9 + Math.sin(time*0.23+s.phase*1.7)*16;\n  const x=r.x+14+((best+s.driftX*0.8)/rows.length)*(r.w-28)+wander*0.5;\n  const y=scale.yOf(hero.equity)+Math.sin(time*1.9+s.phase)*5;\n\n  trail.push([x,y]); if(trail.length>TRAIL) trail.shift();\n  ctx.save();\n  for(let k=1;k\u003ctrail.length;k++){\n    ctx.globalAlpha=(k/trail.length)*0.5; ctx.strokeStyle=C.hero; ctx.lineWidth=1.4;\n    ctx.beginPath(); ctx.moveTo(trail[k-1][0],trail[k-1][1]); ctx.lineTo(trail[k][0],trail[k][1]); ctx.stroke();\n  }\n  ctx.restore();\n  glowPath(C.hero, 16, ()=>{ ctx.moveTo(x+3.4,y); ctx.arc(x,y,3.4,0,6.283); });\n  ctx.save(); ctx.strokeStyle=C.hero; ctx.lineWidth=1.2; ctx.globalAlpha=.85; ctx.beginPath();\n  const beat=Math.sin(time*26+s.wing)*3.4;\n  ctx.moveTo(x-1.5,y-1.5); ctx.lineTo(x-8,y-5-beat);\n  ctx.moveTo(x+1.5,y-1.5); ctx.lineTo(x+8,y-5+beat);\n  ctx.stroke(); ctx.restore();\n\n  const tag=hero.id.toUpperCase(), tw=tag.length*8+16;\n  const tx=clamp(x+12, r.x+4, r.x+r.w-tw-4), ty=clamp(y-26, r.y+26, r.y+r.h-40);\n  ctx.save(); ctx.globalAlpha=.9; ctx.fillStyle=C.void; ctx.fillRect(tx,ty,tw,18);\n  ctx.strokeStyle=C.hero; ctx.lineWidth=1; ctx.strokeRect(tx+.5,ty+.5,tw-1,17); ctx.restore();\n  label(tag, tx+8, ty+13, {color:C.hero, size:10});\n  ctx.strokeStyle=C.hero; ctx.globalAlpha=.5; ctx.beginPath();\n  ctx.moveTo(x,y); ctx.lineTo(tx\u003cx?tx+tw:tx, ty+18); ctx.stroke(); ctx.globalAlpha=1;\n\n  // the hero lineage's equity, generation by generation, across the whole pane\n  const series=RUN.frames.map(q=>q.heroes.real.equity);\n  const lo=Math.min(...series, RUN.start_cash), hi=Math.max(...series, RUN.start_cash);\n  const band=Math.min(96, r.h*0.2), base=r.y+r.h-34;\n  const gy=v=>base-((v-lo)/Math.max(hi-lo,1e-9))*band;\n  ctx.save(); ctx.globalAlpha=.55; ctx.strokeStyle=C.hero; ctx.lineWidth=1.1;\n  ctx.beginPath();\n  for(let g=0; g\u003c=GEN; g++){\n    const px=r.x+ (RUN.generations\u003c2?0:(g/(RUN.generations-1))*r.w);\n    g?ctx.lineTo(px,gy(series[g])):ctx.moveTo(px,gy(series[g]));\n  }\n  ctx.stroke();\n  const px=r.x+(RUN.generations\u003c2?0:(GEN/(RUN.generations-1))*r.w);\n  ctx.globalAlpha=1; ctx.fillStyle=C.hero;\n  ctx.beginPath(); ctx.arc(px,gy(series[GEN]),2,0,6.283); ctx.fill();\n  ctx.restore();\n  label('hero equity by generation', r.x+r.w-14, base+12, {color:C.dim, size:9, align:'right'});\n\n  // the family tree: the chain that ends in this fly\n  const chain=[...hero.ancestors, hero.id].slice(-5);\n  let fx=r.x+12, fy=r.y+r.h-10;\n  label('lineage', fx, fy-16, {color:C.dim, size:9});\n  chain.forEach((id,k)=>{\n    const last=k===chain.length-1, short=id.replace(/^(real|scrambled)-/,'').toUpperCase();\n    const w=label(short, fx, fy, {color:last?C.hero:C.dim, size:9});\n    fx+=w+4;\n    if(!last){ ctx.strokeStyle=C.dim; ctx.globalAlpha=.7; ctx.beginPath();\n      ctx.moveTo(fx-2,fy-3); ctx.lineTo(fx+5,fy-3); ctx.stroke(); ctx.globalAlpha=1; fx+=9; }\n  });\n}\n\n/* ---------- panels ---------- */\nfunction drawScore(r,f){\n  pane(r,'scoreboard · 4 fixed days');\n  const rows=[];\n  for(const tribe of RUN.tribes){\n    const d=f.tribes[tribe];\n    rows.push({name:tribe, best:d.equity.best, median:d.equity.median, survived:d.survived,\n               trades:d.trades.median_per_day, color:TRIBE_COLOR[tribe], tribe:true});\n  }\n  const comp=RUN.competitor_results||{};\n  for(const name of RUN.competitors)\n    if(comp[name]) rows.push({name:name.replace(/_/g,' '), best:comp[name].final_equity, color:C.dim});\n  const all=rows.map(q=>q.best).concat(RUN.start_cash);\n  const lo=Math.min(...all), hi=Math.max(...all);\n  let y=r.y+38;\n  const step=Math.min(56, (r.h-48)/rows.length);\n  for(const row of rows){\n    label(row.name, r.x+10, y, {color:row.color, size:11});\n    value(money(row.best), r.x+r.w-10, y, {color:row.color, size:18, align:'right'});\n    const bx=r.x+10, bw=r.w-20, u=clamp((row.best-lo)/Math.max(hi-lo,1e-9),0,1);\n    ctx.fillStyle=C.grid; ctx.fillRect(bx,y+7,bw,3);\n    ctx.fillStyle=row.color; ctx.fillRect(bx,y+7,Math.max(2,bw*u),3);\n    const base=clamp((RUN.start_cash-lo)/Math.max(hi-lo,1e-9),0,1);\n    ctx.fillStyle=C.ink; ctx.globalAlpha=.5; ctx.fillRect(bx+bw*base,y+5,1,7); ctx.globalAlpha=1;\n    if(row.tribe) label(`median ${money(row.median)}   kept ${row.survived}   ${(+row.trades).toFixed(1)} trades/day`,\n                        r.x+10, y+24, {color:C.dim, size:9});\n    y+=step;\n  }\n}\n\nfunction drawMesh(r,f,time){\n  pane(r,'brain activity');\n  const heat=clamp(f.tribes.real.trades.median_per_day/12,0,1);\n  const R=seeded(7), n=22, pts=[];\n  for(let i=0;i\u003cn;i++) pts.push([r.x+14+R()*(r.w-28), r.y+30+R()*(r.h-46)]);\n  ctx.save(); ctx.strokeStyle=C.real; ctx.globalAlpha=.22; ctx.lineWidth=1; ctx.beginPath();\n  for(let i=0;i\u003cn;i++) for(let j=i+1;j\u003cn;j++){\n    const d=Math.hypot(pts[i][0]-pts[j][0], pts[i][1]-pts[j][1]);\n    if(d\u003cr.w*0.28){ ctx.moveTo(...pts[i]); ctx.lineTo(...pts[j]); }\n  }\n  ctx.stroke(); ctx.restore();\n  const wave=(time*(0.35+heat*1.1))%1;\n  glowPath(C.real, 10, ()=>{\n    pts.forEach((p,i)=>{\n      const u=((i*13)%n)/n, d=(wave-u+1)%1, on=d\u003c0.18;\n      const rad=on?2.6:1.3;\n      ctx.moveTo(p[0]+rad,p[1]); ctx.arc(p[0],p[1],rad,0,6.283);\n    });\n  });\n  label(`median ${(+f.tribes.real.trades.median_per_day).toFixed(1)} trades/day`, r.x+10, r.y+r.h-10, {color:C.dim, size:9});\n}\n\nfunction drawLocked(r,time){\n  pane(r,'locked', {color:C.locked, titleColor:C.locked});\n  ctx.save(); ctx.beginPath(); ctx.rect(r.x+1,r.y+24,r.w-2,r.h-25); ctx.clip();\n  ctx.strokeStyle=C.locked; ctx.globalAlpha=.16; ctx.lineWidth=7;\n  for(let x=-r.h; x\u003cr.w; x+=18){ ctx.beginPath(); ctx.moveTo(r.x+x,r.y+r.h); ctx.lineTo(r.x+x+r.h,r.y+24); ctx.stroke(); }\n  ctx.restore();\n  const pulse=0.55+0.45*Math.sin(time*1.4);\n  ctx.save(); ctx.globalAlpha=pulse;\n  label('last 6 months', r.x+10, r.y+r.h-30, {color:C.locked, size:11});\n  ctx.restore();\n  label('52,915 bars  ·  sealed', r.x+10, r.y+r.h-14, {color:C.dim, size:9});\n}\n\nfunction drawHead(r,f){\n  value(`GEN ${String(f.generation).padStart(2,'0')}`, r.x, r.y+26, {color:C.ink, size:34});\n  const gw=130;\n  label(`of ${RUN.generations-1}`, r.x+gw, r.y+24, {color:C.dim, size:11});\n  label('the same four days, every generation', r.x+gw+70, r.y+14, {color:C.dim, size:10});\n  label(`top ${Math.round((RUN.survive_share||.2)*100)}% reproduce · the rest are eliminated`,\n        r.x+gw+70, r.y+27, {color:C.dim, size:10});\n  const any=days().some(d=>candlesFor(d));\n  label(any?`btc-usd · ${RUN.candle_minutes||30}m candles`:'no candles in this export',\n        r.x+r.w, r.y+27, {color:any?C.dim:C.locked, size:9, align:'right'});\n}\n\n/* ---------- scanlines and the sweep, once, over the finished frame ---------- */\nlet scan=null;\nfunction overlay(time){\n  if(!scan){\n    const s=document.createElement('canvas'); s.width=1; s.height=4;\n    const g=s.getContext('2d'); g.fillStyle='rgba(0,0,0,0.42)'; g.fillRect(0,0,1,2);\n    scan=ctx.createPattern(s,'repeat');\n  }\n  ctx.save(); ctx.globalAlpha=.16; ctx.fillStyle=scan; ctx.fillRect(0,0,W,H); ctx.restore();\n  const y=((time%9)/9)*(H+260)-130;\n  const g=ctx.createLinearGradient(0,y-130,0,y+130);\n  g.addColorStop(0,'rgba(47,245,200,0)'); g.addColorStop(.5,'rgba(47,245,200,0.045)');\n  g.addColorStop(1,'rgba(47,245,200,0)');\n  ctx.save(); ctx.fillStyle=g; ctx.fillRect(0,y-130,W,260); ctx.restore();\n}\n\n/* ---------- the frame ---------- */\nfunction resize(){\n  W=innerWidth; H=innerHeight; dpr=Math.min(2, devicePixelRatio||1);\n  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);\n  ctx.setTransform(dpr,0,0,dpr,0,0);\n  chartKey='';\n}\nfunction render(time){\n  const f=frame(), L=layout();\n  ctx.fillStyle=C.void; ctx.fillRect(0,0,W,H);\n  drawHead(L.head,f);\n\n  pane(L.world,null);\n  const chart=chartLayer(L.world);\n  ctx.save();\n  ctx.beginPath(); ctx.rect(L.world.x,L.world.y,L.world.w,L.world.h); ctx.clip();\n  ctx.globalAlpha=.82;\n  ctx.drawImage(chart, L.world.x, L.world.y, L.world.w, L.world.h);\n  ctx.globalAlpha=1;\n  dayLabels(L.world);\n  const scale=drawFlies(L.world,f,time);\n  drawHero(L.world,f,time,scale);\n  ctx.restore();\n  ctx.strokeStyle=C.grid; ctx.strokeRect(L.world.x+.5,L.world.y+.5,L.world.w-1,L.world.h-1);\n\n  if(pileThrough!==GEN) rebuildPile(GEN);\n  drawPile(L.pile);\n  drawScore(L.score,f);\n  drawMesh(L.mesh,f,time);\n  drawLocked(L.locked,time);\n  overlay(time);\n}\n\nfunction paintUI(){\n  const f=frame();\n  document.getElementById('scrub').value=GEN;\n  document.getElementById('gen').innerHTML=\n    `\u003cb>${money(f.tribes.real.equity.best)}\u003c/b> real · \u003cb>${money(f.tribes.scrambled.equity.best)}\u003c/b> scrambled`;\n  document.getElementById('play').textContent=PLAYING?'pause':'play';\n}\nfunction setGeneration(g){\n  GEN=clamp(Math.round(g),0,RUN.generations-1);\n  if(pileThrough>GEN) rebuildPile(GEN);\n  paintUI();\n}\n\nlet frozen=qs.has('frame')?+qs.get('frame')/30:null;\nfunction loop(now){\n  requestAnimationFrame(loop);\n  if(innerWidth!==W||innerHeight!==H) resize();\n  if(PLAYING && now-lastTick>=MS_PER_GEN){\n    lastTick=now;\n    setGeneration(GEN+1>=RUN.generations?0:GEN+1);\n  }\n  render(frozen!=null?frozen:(now-t0)/1000);\n}\n\nasync function boot(){\n  resize();\n  try{\n    if(window.__HEDGEFLY_RUN__) RUN=window.__HEDGEFLY_RUN__;       // inlined: the inset in hedgefly.html\n    else{\n      const r=await fetch(qs.get('data')||'../hq/runs.json',{cache:'no-store'});\n      if(!r.ok) throw new Error('runs.json: '+r.status);\n      RUN=await r.json();\n    }\n  }catch(e){\n    document.getElementById('boot').textContent='no runs.json — serve over http; see visuals/hq/data-contract.md';\n    console.error(e); return;\n  }\n  RUN.tribes=RUN.tribes||['real','scrambled'];\n  RUN.competitors=RUN.competitors||['momentum','random','buy_and_hold'];\n  document.getElementById('boot').remove();\n  document.getElementById('ui').hidden=false;\n  if(VERTICAL) document.body.classList.add('vertical');\n  const scrub=document.getElementById('scrub');\n  scrub.max=RUN.generations-1;\n  scrub.oninput=e=>{PLAYING=false; setGeneration(+e.target.value); paintUI()};\n  document.getElementById('play').onclick=()=>{PLAYING=!PLAYING; lastTick=performance.now(); paintUI()};\n  // as an inset inside the HQ, follow the generation the HQ is showing\n  addEventListener('message',e=>{if(e.data&&e.data.hedgefly==='gen'){PLAYING=false;setGeneration(+e.data.gen)}});\n  addEventListener('k <script>
'use strict';
/* visuals/lib/neon-riso.js — the shared drawing core of the neon riso look (visuals/style.md).
   Loaded by visuals/hq2/ and visuals/posters/; scripts/build_standalone.mjs inlines it.
   Adapted from the riso-rooms engine: black paper, fluorescent inks, additive plates. */
/* =====================================================================
   NEON RISO — the shared drawing core (visuals/style.md).
   A risograph engine turned inside out: black paper, fluorescent inks, and plates that ADD
   light where they overlap instead of darkening. Used by visuals/hq2 and visuals/posters.
   ===================================================================== */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;

/* ---------- seeded randomness: same keys -> same numbers, every frame ---------- */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function stream(...keys){let h=0x9E3779B9;for(const k of keys){h=Math.imul(h^hashStr(String(k)),0x85EBCA6B);h^=h>>>13}const r=mulberry(h>>>0);r();r();return r}
const rand=(R,a,b)=>a+R()*(b-a);
const randi=(R,a,b)=>Math.floor(rand(R,a,b+1));
const pick=(R,arr)=>arr[Math.floor(R()*arr.length)];
function hash2(x,y,s){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function noise(x,y,s=0){const xi=Math.floor(x),yi=Math.floor(y),u=x-xi,v=y-yi,a=u*u*(3-2*u),b=v*v*(3-2*v);

/* ---------- polyline helpers ---------- */
function resample(P,step){
  const out=[P[0].slice()];let need=step;
  for(let n=1;n<P.length;n++){let x0=P[n-1][0],y0=P[n-1][1];const x1=P[n][0],y1=P[n][1];let d=Math.hypot(x1-x0,y1-y0);
    while(d>=need&&d>0){const t=need/d;x0+=(x1-x0)*t;y0+=(y1-y0)*t;out.push([x0,y0]);d-=need;need=step}need-=d}

  return out}

  for(let k=0;k<it;k++){const q=[],n=p.length;if(!closed)q.push(p[0]);
    for(let i=0;i<(closed?n:n-1);i++){const a=p[i],b=p[(i+1)%n];q.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}

  return p}

/* ---------- isometric projection: i runs right-down, j runs left-down, z up ---------- */
const TW=64,TH=32,TZ=32;
const iso=(i,j,z=0)=>[(i-j)*TW/2,(i+j)*TH/2-z*TZ];

/* ---------- paper and inks: every colour means one thing (visuals/style.md) ---------- */
const PAPER=[7,7,11];                               // near-black stock, a violet cast, never #000
const INKS={
  cyan:[39,242,210],    // the real tribe, and nothing else
  magenta:[255,61,154], // the scrambled tribe, and nothing else
  gold:[255,201,60],    // the hero lineage alone
  amber:[255,122,26],   // the locked test set alone
  slate:[91,108,255],   // architecture: walls, floors, furniture
  ghost:[216,220,255],  // linework and small type
};
// The riso prop library was written for four warm inks. Its defaults are mapped onto the two
// neutral inks here, so no piece of furniture can ever print in a tribe's colour by accident.
const ALIAS={blue:'ghost', coral:'slate', yellow:'ghost', teal:'slate'};
const inkOf=k=>INKS[k]?k:(ALIAS[k]||'ghost');
const ANGLE={cyan:15,magenta:75,gold:0,amber:30,slate:45,ghost:105};   // screen angles: the moiré is the point
const MISREG=1.1;                                   // plate misregistration in world px
const css=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const PAPER_CSS=css(PAPER);

/* ---------- halftone screens ---------- */
const SS=4,CELL=2.3,TILE_N=8,LEVELS=16;   // CELL = dot pitch in world px
const tiles=new Map();
function halftoneTile(ink,level){
  const key=ink+'|'+level;let cv=tiles.get(key);if(cv)return cv;
  ink=inkOf(ink);
  const cell=CELL*SS,size=cell*TILE_N,tone=level/LEVELS,salt=hashStr(ink)%9973;
  cv=document.createElement('canvas');cv.width=cv.height=size;
  const c=cv.getContext('2d');c.fillStyle=css(INKS[ink]);
  if(level>=LEVELS)c.fillRect(0,0,size,size);
  else if(tone<=.5){                                  // growing dots
    for(let y=0;y<TILE_N;y++)for(let x=0;x<TILE_N;x++){
      const r=cell*Math.sqrt(tone/Math.PI)*(.9+hash2(x,y,salt+level)*.18);
      const jx=(hash2(x,y,salt)-.5)*.08*cell,jy=(hash2(y,x,salt)-.5)*.08*cell;
      c.beginPath();c.arc((x+.5)*cell+jx,(y+.5)*cell+jy,r,0,TAU);c.fill()}
  }else{                                              // solid with shrinking holes
    c.fillRect(0,0,size,size);c.globalCompositeOperation='destination-out';
    for(let y=0;y<=TILE_N;y++)for(let x=0;x<=TILE_N;x++){
      const r=cell*Math.sqrt((1-tone)/Math.PI)*(.9+hash2(x%TILE_N,y%TILE_N,salt+level)*.18);
      c.beginPath();c.arc(x*cell,y*cell,r,0,TAU);c.fill()}
  }
  c.globalCompositeOperation='destination-out';       // worn-drum specks
  const R=stream('speck',ink,level),n=size*size/260;
  for(let k=0;k<n;k++){const s=rand(R,1,3.4);c.globalAlpha=rand(R,.25,.9);c.fillRect(R()*size,R()*size,s,s)}
  tiles.set(key,cv);return cv}
const screens=new WeakMap();
function screen(ctx,ink,tone,dx,dy){
  let bank=screens.get(ctx);if(!bank)screens.set(ctx,bank=new Map());
  const level=clamp(Math.round(tone*LEVELS),1,LEVELS),key=`${ink}|${level}|${dx.toFixed(2)}|${dy.toFixed(2)}`;
  let pat=bank.get(key);if(pat)return pat;
  pat=ctx.createPattern(halftoneTile(ink,level),'repeat');
  pat.setTransform(new DOMMatrix().translateSelf(dx,dy).rotateSelf(ANGLE[ink]||0).scaleSelf(1/SS));
  bank.set(key,pat);return pat}

/* ---------- paper grain ---------- */
let grainPattern=null;
function grain(ctx){
  if(grainPattern)return grainPattern;
  const cv=document.createElement('canvas');cv.width=cv.height=384;const c=cv.getContext('2d'),R=stream('grain');
  for(let k=0;k<2600;k++){c.fillStyle=css(INKS.ghost,rand(R,.02,.07));const s=rand(R,.6,1.8);c.fillRect(R()*384,R()*384,s,s)}
  for(let k=0;k<120;k++){c.strokeStyle=css(pick(R,[INKS.slate,INKS.ghost]),rand(R,.03,.07));c.lineWidth=.6;const x=R()*384,y=R()*384,a=R()*TAU,l=rand(R,4,12);
    c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+Math.cos(a+.6)*l*.5,y+Math.sin(a+.6)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);c.stroke()}
  return grainPattern=ctx.createPattern(cv,'repeat')}

/* =====================================================================
   THE PEN — every mark goes through here. Points are screen-space [x,y]
   arrays; pen.p(i,j,z) turns room coordinates into them.
   ===================================================================== */
function makePen(ctx,opt={}){
  const ox=opt.ox||0,oy=opt.oy||0,boil=opt.boil||0,variant=boil%3;
  const plate={};for(const k in INKS){const J=stream('plate',k,variant);plate[k]=[rand(J,-1,1)*MISREG,rand(J,-1,1)*MISREG]}
  const pen={ctx,boil,ox,oy};
  const p=pen.p=(i,j,z=0)=>{const q=iso(i,j,z);return [q[0]+ox,q[1]+oy]};
  const trace=(P,dx=0,dy=0)=>{ctx.beginPath();for(let n=0;n<P.length;n++){const x=P[n][0]+dx,y=P[n][1]+dy;n?ctx.lineTo(x,y):ctx.moveTo(x,y)}};
  const withInk=(ink,tone,fn)=>{ink=inkOf(ink);const [dx,dy]=plate[ink];
    ctx.globalCompositeOperation='screen';fn(screen(ctx,ink,tone,dx,dy),dx,dy);ctx.globalCompositeOperation='source-over'};

  /* --- fills --- */
  pen.knock=(P,a=1)=>{if(P.length<3)return;trace(P);ctx.closePath();ctx.fillStyle=a===1?PAPER_CSS:css(PAPER,a);ctx.fill()};
  pen.tint=(P,ink,tone=1)=>{if(tone<=0||P.length<3)return;if(ink==='blue'){ink='slate';tone*=.6}withInk(ink,tone,(st,dx,dy)=>{trace(P,dx,dy);ctx.closePath();ctx.fillStyle=st;ctx.fill()})};
  pen.fill=(P,ink,tone=1)=>{pen.knock(P);if(ink&&ink!=='paper')pen.tint(P,ink,tone)};
  // light cannot cast a shadow by adding light: a shadow is the paper showing through, darker
  pen.shade=(P,a=.6)=>pen.knock(P,a);

  /* --- the hand-drawn line --- */
  pen.line=(P,ink='blue',w=1.3,o={})=>{
    if(!P||P.length<2)return;
    const legacy=ink==='blue';                         // prop linework: architecture, kept quiet
    const src=o.closed?[...P,P[0]]:P;
    let Q=resample(src,Math.max(2.5,w*1.5));if(Q.length<2)return;
    const amp=o.amp??(.35+w*.15);
    if(amp>0){
      const seed=(hash2(Math.round(src[0][0]*3),Math.round(src[0][1]*3),boil*7+1)*1e6)|0;let s=0;
      Q=Q.map((q,n)=>{if(n)s+=Math.hypot(q[0]-Q[n-1][0],q[1]-Q[n-1][1]);
        return [q[0]+noise(s*.045,.5,seed)*amp+(hash2(n,seed,1)-.5)*amp*.3,q[1]+noise(s*.045,7.5,seed)*amp+(hash2(seed,n,2)-.5)*amp*.3]});
      if(o.closed)Q[Q.length-1]=Q[0].slice();
    }
    withInk(ink,(o.tone??1)*(legacy?.5:1),(st,dx,dy)=>{ctx.strokeStyle=st;ctx.lineWidth=w;ctx.lineCap=o.cap||'round';ctx.lineJoin='round';
      if(o.dash)ctx.setLineDash(o.dash);trace(Q,dx,dy);ctx.stroke();if(o.dash)ctx.setLineDash([])});
  };
  pen.shape=(P,fill,o={})=>{if(fill)pen.fill(P,fill[0],fill[1]);if(o.line!==false)pen.line(P,o.line||'ghost',o.w??1.2,{closed:true,amp:o.amp,tone:o.lineTone??.5})};
  pen.dot=(x,y,r,ink='blue',tone=1)=>pen.tint(pen.circle(x,y,r,10),ink,tone);

  /* --- geometry (all return point arrays) --- */
  pen.floorQuad=(i,j,w,d,z=0)=>[p(i,j,z),p(i+w,j,z),p(i+w,j+d,z),p(i,j+d,z)];
  pen.wallQuad=(wall,u,z,w,h,off=.02)=>{const W=(a,zz)=>wall==='i'?p(u+a,off,zz):p(off,u+a,zz);return [W(0,z),W(w,z),W(w,z+h),W(0,z+h)]};
  pen.ellipse=(ci,cj,z,ri,rj=ri,n=28)=>Array.from({length:n},(_,k)=>{const a=k/n*TAU;return p(ci+Math.cos(a)*ri,cj+Math.sin(a)*rj,z)});
  pen.circle=(x,y,r,n=18)=>Array.from({length:n},(_,k)=>[x+Math.cos(k/n*TAU)*r,y+Math.sin(k/n*TAU)*r]);
  pen.blob=(x,y,rx,ry,key='blob',lump=.22,n=9)=>{const R=stream('blob',key),P=[];
    for(let k=0;k<n;k++){const a=k/n*TAU+rand(R,-.2,.2),m=1+rand(R,-lump,lump);P.push([x+Math.cos(a)*rx*m,y+Math.sin(a)*ry*m])}
    return smooth(P,true,3)};
  pen.leaf=(a,b,wid)=>{const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L*wid,ny=dx/L*wid;
    return smooth([a,[mx+nx,my+ny],b,[mx-nx,my-ny]],true,2)};

  /* --- solids --- */
  pen.box=(i,j,z,w,d,h,o={})=>{
    const ink=o.ink||'coral',tone=o.tone??.5;
    if(o.shadow!==false)pen.shade(pen.floorQuad(i+.12,j+.18,w,d,z),.6);
    const top=pen.floorQuad(i,j,w,d,z+h);
    const faceJ=[p(i,j+d,z),p(i+w,j+d,z),p(i+w,j+d,z+h),p(i,j+d,z+h)];   // lower-left face
    const faceI=[p(i+w,j,z),p(i+w,j+d,z),p(i+w,j+d,z+h),p(i+w,j,z+h)];   // lower-right face
    pen.fill(faceJ,o.leftInk||ink,o.left??clamp(tone+.3,0,1));
    pen.fill(faceI,o.rightInk||ink,o.right??clamp(tone+.15,0,1));
    pen.fill(top,o.topInk||ink,o.top??tone);
    if(o.line!==false){const lw=o.w??1.1;for(const F of[faceJ,faceI,top])pen.line(F,'blue',lw,{closed:true})}
    return {top,faceI,faceJ}};

  /* --- the room shell --- */
  pen.shell=(r)=>{
    const {w,d,h}=r,st=r.style||{},T=.25;
    const [fi,ft]=st.floor||['blue',.65],[wi,wt]=st.wall||['coral',.3],[wi2,wt2]=st.wall2||[wi,Math.min(1,wt+.12)];
    const sideJ=[p(-T,d,0),p(w,d,0),p(w,d,-.5),p(-T,d,-.5)],sideI=[p(w,-T,0),p(w,d,0),p(w,d,-.5),p(w,-T,-.5)];
    pen.shape(sideJ,[fi,Math.min(1,ft+.25)]);pen.shape(sideI,[fi,Math.min(1,ft+.12)]);
    pen.shape(pen.floorQuad(-T,-T,w+T,d+T,0),[fi,ft],{w:1.4});
    if(st.planks!==false)for(let a=st.plank||.8;a<d;a+=st.plank||.8)pen.line([p(0,a,0),p(w,a,0)],'blue',.6,{tone:.9,amp:.25});
    if(h>0){
      pen.shape(pen.wallQuad('j',0,0,d,h,0),[wi2,wt2]);
      pen.shape(pen.wallQuad('i',0,0,w,h,0),[wi,wt]);
      pen.shape([p(w,-T,0),p(w,0,0),p(w,0,h),p(w,-T,h)],[wi,Math.min(1,wt+.3)]);
      pen.shape([p(-T,d,0),p(0,d,0),p(0,d,h),p(-T,d,h)],[wi2,Math.min(1,wt2+.3)]);
      pen.shape([p(-T,-T,h),p(w,-T,h),p(w,0,h),p(0,0,h),p(0,d,h),p(-T,d,h)],['paper',0]);
      pen.line([p(0,d,.12),p(0,0,.12),p(w,0,.12)],'blue',.8,{tone:.8});
    }};

  /* --- furniture & props --- */
  pen.table=(i,j,w,d,h=.75,o={})=>{const ink=o.ink||'coral',tone=o.tone??.55,L=.12;
    pen.shade(pen.floorQuad(i+.2,j+.25,w,d,0),.6);
    for(const [a,b] of [[i,j],[i+w-L,j],[i,j+d-L],[i+w-L,j+d-L]])pen.box(a,b,0,L,L,h-.1,{ink,tone:tone+.2,shadow:false,w:.8});
    pen.box(i-.05,j-.05,h-.1,w+.1,d+.1,.1,{ink,tone,shadow:false});
    return p(i+w/2,j+d/2,h)};
  pen.chair=(i,j,o={})=>{const ink=o.ink||'yellow',tone=o.tone??.7,L=.07;
    pen.shade(pen.floorQuad(i+.1,j+.15,.5,.5,0),.6);
    for(const [a,b] of [[i,j],[i+.5-L,j],[i,j+.5-L],[i+.5-L,j+.5-L]])pen.box(a,b,0,L,L,.4,{ink:'blue',tone:.8,shadow:false,w:.6});
    if(o.back==='j')pen.box(i,j,.45,.5,.07,.55,{ink,tone,shadow:false,w:.9});
    else pen.box(i,j,.45,.07,.5,.55,{ink,tone,shadow:false,w:.9});
    pen.box(i,j,.4,.5,.5,.06,{ink,tone,shadow:false,w:.9})};
  pen.rug=(i,j,w,d,o={})=>{const ink=o.ink||'teal',tone=o.tone??.45;
    pen.shape(pen.floorQuad(i,j,w,d,.01),[ink,tone],{w:1});
    pen.line(pen.floorQuad(i+.3,j+.3,w-.6,d-.6,.01),o.border||'coral',1.1,{closed:true,tone:.8});
    for(let a=.1;a<d;a+=.18){pen.line([p(i,j+a,0),p(i-.2,j+a,0)],ink,.6,{amp:.1});pen.line([p(i+w,j+a,0),p(i+w+.2,j+a,0)],ink,.6,{amp:.1})}};
  pen.bookcase=(wall,u,wid,hgt,o={})=>{
    const R=stream('shelf',wall,u),rows=o.rows||4,dep=o.depth||.45,ink=o.ink||'coral';
    const [bi,bj,bw,bd]=wall==='i'?[u,0,wid,dep]:[0,u,dep,wid];
    pen.box(bi,bj,0,bw,bd,hgt,{ink,tone:.65});
    const F=(a,z)=>wall==='i'?p(u+a,dep,z):p(dep,u+a,z);
    const rowH=(hgt-.2)/rows;
    for(let r=0;r<rows;r++){const z0=.12+r*rowH,z1=z0+rowH-.08;
      pen.fill([F(.08,z0),F(wid-.08,z0),F(wid-.08,z1),F(.08,z1)],'blue',.85);
      let a=.1;
      while(a<wid-.18){const bw_=rand(R,.07,.14),bh=(z1-z0)*rand(R,.62,.95);
        if(R()<.07){a+=rand(R,.12,.3);continue}
        const q=[F(a,z0),F(a+bw_,z0),F(a+bw_,z0+bh),F(a,z0+bh)];
        pen.fill(q,pick(R,['coral','yellow','teal','paper','coral','teal']),rand(R,.45,.95));
        pen.line(q,'blue',.55,{closed:true,amp:.1});a+=bw_+.012}
      pen.line([F(0,z0),F(wid,z0)],'blue',1.3)}};
  pen.window=(wall,u,z,wid,hgt,o={})=>{
    const q=pen.wallQuad(wall,u,z,wid,hgt),W=(a,zz)=>wall==='i'?p(u+a,.02,zz):p(.02,u+a,zz);
    pen.fill(q,o.sky||'teal',.22);pen.tint(pen.wallQuad(wall,u,z,wid,hgt*.4),'yellow',.3);
    pen.line(q,'blue',1.8,{closed:true});
    pen.line([W(wid/2,z),W(wid/2,z+hgt)],'blue',1.1);pen.line([W(0,z+hgt*.55),W(wid,z+hgt*.55)],'blue',1.1);
    pen.line([W(-.12,z-.03),W(wid+.12,z-.03)],'blue',2.4);
    if(o.patch!==false)pen.sunPatch(wall,u,z,wid,hgt,o)};
  pen.sunPatch=(wall,u,z,wid,hgt,o={})=>{const k=o.reach??1.1,s=o.shear??.45,F=(a,b)=>wall==='i'?p(a,b,.01):p(b,a,.01);
    const q=[F(u+z*s,z*k),F(u+wid+z*s,z*k),F(u+wid+(z+hgt)*s,(z+hgt)*k),F(u+(z+hgt)*s,(z+hgt)*k)];
    pen.light(q,o.light??.5)};
  // light can't come from multiply alone: lift the paper first, then print yellow on top
  pen.light=(P,strength=.5,ink='ghost')=>pen.tint(P,ink,.12+.3*strength);
  pen.glow=(i,j,z,r,ink='ghost',strength=.6)=>{for(let k=0;k<4;k++){const E=pen.ellipse(i,j,z,r*(1-k*.22));pen.tint(E,ink,strength*(k+1)/9)}};
  pen.halo=(x,y,r,ink,strength=.5)=>{for(let k=0;k<3;k++)pen.tint(pen.circle(x,y,r*(1-k*.28),18),ink,strength*(k+1)/7)};
  pen.lamp=(i,j,o={})=>{const h=o.h??1.8,t=o.t||0,on=o.on!==false,fl=.85+.15*noise(t*5,0,hashStr(`${i},${j}`)%999);
    if(on)pen.glow(i,j,0,1.7,'yellow',.55*fl);
    pen.fill(pen.ellipse(i,j,0,.22),'blue',.7);
    pen.line([p(i,j,0),p(i,j,h)],'blue',1.5,{amp:.2});
    const [sx,sy]=p(i,j,h);
    if(on)pen.light([[sx-7,sy+5],[sx+7,sy+5],[sx+30,sy+h*TZ],[sx-30,sy+h*TZ]],.25*fl);
    pen.shape([[sx-8,sy+5],[sx+8,sy+5],[sx+4,sy-6],[sx-4,sy-6]],[o.ink||'teal',.8])};
  pen.plant=(i,j,z=0,o={})=>{const R=stream('plant',i,j),s=o.size||1,ink=o.ink||'teal',t=o.t||0;
    pen.box(i-.2*s,j-.2*s,z,.4*s,.4*s,.38*s,{ink:o.pot||'coral',tone:.55});
    const [x,y]=p(i,j,z+.38*s),n=o.leaves||8;
    for(let k=0;k<n;k++){const a=-Math.PI/2+rand(R,-1.2,1.2),len=rand(R,14,28)*s,sway=Math.sin(t*1.4+k)*1.2;
      pen.shape(pen.leaf([x,y],[x+Math.cos(a)*len+sway,y+Math.sin(a)*len],rand(R,3.5,6.5)*s),[ink,rand(R,.55,.95)],{w:.8})}};
  pen.books=(i,j,z,n,o={})=>{const R=stream('books',i,j);let zz=z;
    for(let k=0;k<n;k++){const th=rand(R,.08,.14),dx=rand(R,-.06,.06);
      pen.box(i+dx,j+dx*.5,zz,.5,.36,th,{ink:pick(R,['coral','teal','yellow','blue']),tone:rand(R,.4,.8),shadow:k===0,w:.8,top:0});zz+=th}};
  pen.steam=(x,y,t,o={})=>{for(let k=0;k<(o.n||2);k++){const P=[],ph=t*1.6+k*1.7;
    for(let s=0;s<=10;s++){const u=s/10;P.push([x+(k-.5)*4+Math.sin(ph*3+u*5)*2.5*u,y-u*(o.h||18)])}
    pen.line(P,o.ink||'blue',.8,{tone:.55*(1-((t*.8+k*.5)%1)*.5),amp:.2})}};
  pen.sparkle=(x,y,r,ink='yellow',t=0)=>{const a0=t*1.5,k=.6+.4*Math.sin(t*4+x);
    for(let q=0;q<4;q++){const a=a0+q*Math.PI/4,rr=r*k*(q%2?.55:1);pen.line([[x-Math.cos(a)*rr,y-Math.sin(a)*rr],[x+Math.cos(a)*rr,y+Math.sin(a)*rr]],ink,1.1,{amp:0})}};

  /* --- characters: every one of them is a fly (see FLIES below) --- */
  installFlies(pen);

  return pen;
}

/* =====================================================================
   FLIES — every character is one (visuals/style.md). Installed on each pen.
   ===================================================================== */
const ellipse2=(cx,cy,rx,ry,rot=0,n=20)=>Array.from({length:n},(_,k)=>{const a=k/n*TAU,x=Math.cos(a)*rx,y=Math.sin(a)*ry;
  return [cx+x*Math.cos(rot)-y*Math.sin(rot), cy+x*Math.sin(rot)+y*Math.cos(rot)]});
function installFlies(pen){
  const p=pen.p;
  /* A fly character standing, sitting or hovering at room point (i,j,z). s=1 is about the
     height of a chair back. `ink` says who it is: a tribe, the hero, or 'slate' for staff. */
  pen.fly=(i,j,z=0,o={})=>{
    const t=o.t||0,s=o.scale||1,f=o.facing===-1?-1:1,ink=o.ink||'slate',tone=o.tone??.85;
    const pose=o.pose||'stand',ph=t*TAU*(o.speed||.6)+(o.phase||0);
    const lift=pose==='hover'?12+Math.sin(ph*1.3)*3:pose==='sit'?-4:0;
    const [bx,by0]=p(i,j,z),by=by0-lift*s,X=v=>bx+v*s*f,Y=v=>by+v*s;
    const eyes=ink==='slate'?'ghost':ink;
    if(!o.noShadow)pen.shade(pen.ellipse(i,j,z,.26*s,.2*s,14),.55);
    if(o.glow!==false)pen.halo(X(0),Y(-18),24*s,ink,.32*(o.glowStrength??1));
    for(const [lx,dx] of [[-5,-7],[-1,-2],[3,5]]){                                   // six legs
      if(pose==='hover')pen.line([[X(lx),Y(-12)],[X(lx+dx*.4),Y(-3)],[X(lx+dx*.6),Y(3)]],'ghost',.8*s,{tone:.5});
      else pen.line([[X(lx),Y(-12)],[X(lx+dx),Y(-8)],[X(lx+dx*1.2),Y(0)]],'ghost',.9*s,{tone:.7});
    }
    const beat=o.dead?0:Math.sin(t*30+(o.phase||0)*7);                              // wings flicker every frame
    // wings are light, not card: tinted without knocking out what is behind them
    for(const [root,tip,wid,tone] of [[[X(-1),Y(-21)],[X(-16),Y(-35-beat*5)],5.5*s,.22],[[X(0),Y(-22)],[X(-7),Y(-41+beat*5)],4.8*s,.18]]){
      const L=pen.leaf(root,tip,wid);pen.tint(L,ink,tone);pen.line(L,'ghost',.7,{closed:true,tone:.45});
    }
    pen.shape(ellipse2(X(-5),Y(-13),7.5*s,5.5*s,.35*f),[ink,tone*.75],{line:ink,w:1*s,lineTone:.9});   // abdomen
    for(const k of[-2,1.5])pen.line([[X(-6+k),Y(-18)],[X(-4+k),Y(-8)]],'paper',1*s,{tone:1,amp:.2});
    pen.shape(pen.circle(X(1),Y(-19),5*s,14),[ink,tone],{line:ink,w:1*s,lineTone:.95});    // thorax
    const hy=pose==='sit'?-22:-24;
    pen.shape(pen.circle(X(6),Y(hy),4.3*s,14),[ink,tone*.9],{line:ink,w:.9*s});              // head
    for(const [ex,ey,er] of [[8,hy-1.4,2.7],[4.6,hy-2,2.3]]){                                // compound eyes
      pen.shape(pen.circle(X(ex),Y(ey),er*s,12),[eyes,1],{line:false});
      pen.dot(X(ex+.7),Y(ey-.8),.7*s,'ghost',.9);
    }
    pen.line([[X(6),Y(hy-4)],[X(8),Y(hy-9)]],'ghost',.7*s,{tone:.6});                      // antennae
    pen.line([[X(5),Y(hy-4)],[X(4),Y(hy-9)]],'ghost',.7*s,{tone:.6});
    return {head:[X(6),Y(hy)],hand:[X(10),Y(-10)],top:[X(-8),Y(-42)]};
  };
  /* A crowd fly: cheap enough to draw a hundred of. Body, eye, two wing strokes. */
  pen.minifly=(x,y,s,ink,tone=.9,t=0,phase=0)=>{
    const beat=Math.sin(t*30+phase*7)*1.6*s;
    pen.line([[x-1*s,y-1*s],[x-5*s,y-4*s-beat]],'ghost',.7,{tone:.55,amp:0});
    pen.line([[x+.5*s,y-1.2*s],[x-2*s,y-5.5*s+beat]],'ghost',.7,{tone:.5,amp:0});
    pen.dot(x,y,2.1*s,ink,tone);
    pen.dot(x+2*s,y-.8*s,1.1*s,ink,Math.min(1,tone+.1));
  };
  /* An eliminated fly: on its back, legs up, wings flat. For the pile. */
  pen.deadfly=(x,y,s,ink,tone=.55,rot=0)=>{
    const c=Math.cos(rot),sn=Math.sin(rot),R=(dx,dy)=>[x+dx*c-dy*sn,y+dx*sn+dy*c];
    pen.dot(...R(0,0),2.4*s,ink,tone);
    pen.dot(...R(2.6*s,0),1.3*s,ink,tone*.9);
    for(const k of[-1.4,0,1.4])pen.line([R(k*s,-1.2*s),R(k*s+.6*s,-3.4*s)],ink,.6,{tone:tone*.8,amp:0});
  };
}

  if(o.wall==='j'){ux=[size*.62*Math.cos(.4636),-size*.62*Math.sin(.4636)]}

function headlineFor(run,g){
  const f=run.frames[g],prev=g?run.frames[g-1]:null,r=f.tribes.real,s=f.tribes.scrambled,h=f.heroes.real;

  if(r.equity.median>s.equity.median&&r.equity.best>s.equity.best)return 'The real brains pull ahead';

}

<script>

const ROOMS=[];

function layout(){

// camera drift: a slow, never-repeating wander, only once the viewer has left the camera alone
function drift(s){return {x:Math.sin(s*.13)*16+Math.sin(s*.047)*9,y:Math.sin(s*.09+1.3)*9,z:1+Math.sin(s*.061)*.035}}

const pointers=new Map();let drag=null,pinch=null;

/* =====================  THE LAB  =====================

room({id:'lab',col:0,row:0,w:7,d:7,h:3,

  draw(pen,t,R){

/* =====================  THE BRAIN ROOM  =====================

room({id:'brain',col:1,row:0,w:7,d:7,h:3.4,
  style:{floor:['slate',.34],wall:['slate',.12],wall2:['slate',.16],planks:false},
  draw(pen,t,R){
    const p=pen.p,f=F();
    for(const [i,j,ink] of[[1.7,4.5,'cyan'],[5.1,1.5,'magenta']]){

      pen.glow(i,j,.02,1.8,ink,.4);

      const S=stream(key),N=20,nodes=[];
      for(let k=0;k<N;k++){const a=rand(S,0,TAU),b=Math.acos(rand(S,-1,1)),r=radius*(.55+.45*rand(S,0,1));
        nodes.push([ci+r*Math.sin(b)*Math.cos(a),cj+r*Math.sin(b)*Math.sin(a),cz+r*Math.cos(b)*.9])}

        for(const m of tangled?[randi(S,0,N-1),randi(S,0,N-1)]:[near[0][0],near[1][0]])edges.push([k,m]);

    text(pen,'NEURONS EACH',pen.wallQuad('j',6.35,2.38,.01,.01,.11)[0],11,{wall:'j',tone:.6});
    text(pen,'ONE EYE, SHARED',pen.wallQuad('j',6.35,1.95,.01,.01,.11)[0],11,{wall:'j',tone:.75});
    pen.box(.4,1.2,0,.7,2.2,.45,{ink:'slate',tone:.3});
    pen.fly(.8,2.1,.45,{t,pose:'sit',ink:'slate',scale:1.1,phase:1.1});
    pen.fly(5.6,4.9,0,{t,pose:'hover',ink:'slate',scale:1.2,facing:-1,phase:2.4});
    pen.plant(6.5,6.2,0,{t,size:1.05});
  }});

/* =====================  THE VAULT  =====================

room({id:'vault',col:3,row:0,w:7,d:7,h:3.2,
  style:{floor:['slate',.34],wall:['slate',.14],wall2:['slate',.18],planks:false},
  draw(pen,t,R){

/* =====================  THE TRADING FLOOR  =====================
   Two wings of fly traders, four to a desk, under a wall-sized screen of the four fixed days. */
room({id:'floor',col:0,row:1,w:10,d:8,h:3.4,
  style:{floor:['slate',.26],wall:['slate',.12],wall2:['slate',.15],planks:true},
  draw(pen,t,R){
    const p=pen.p,f=F();
    // the screen: the real candles of the four fixed days, each day on its own scale
    const U0=.6,U1=9.4,Z0=1.35,Z1=3.05;
    pen.shape(pen.wallQuad('i',U0-.12,Z0-.14,U1-U0+.24,Z1-Z0+.28,.04),['slate',.35],{w:1.5});
    pen.shape(pen.wallQuad('i',U0,Z0,U1-U0,Z1-Z0,.06),['paper',0],{w:.8,lineTone:.4});
    const days=RUN?RUN.windows:[],gap=.12,dw=(U1-U0-gap*(days.length-1))/Math.max(1,days.length);
    days.forEach((day,d)=>{
      const bars=day.candles||[];if(!bars.length)return;
      const lo=Math.min(...bars.map(b=>b[2])),hi=Math.max(...bars.map(b=>b[1])),span=Math.max(hi-lo,1e-9);
      const z=v=>Z0+.12+(v-lo)/span*(Z1-Z0-.34),u0=U0+d*(dw+gap),bw=dw/bars.length;
      const W=(u,zz)=>p(u,.07,zz);
      bars.forEach(([o,h,l,c],k)=>{const u=u0+(k+.5)*bw,ink=c>=o?'ghost':'slate',tone=c>=o?.8:.9;
        pen.line([W(u,z(l)),W(u,z(h))],ink,.7,{tone:tone*.8,amp:0});
        const a=z(Math.min(o,c)),b=Math.max(z(Math.max(o,c)),a+.012);
        pen.tint([W(u-bw*.32,a),W(u+bw*.32,a),W(u+bw*.32,b),W(u-bw*.32,b)],ink,tone)});
      if(d)pen.line([W(u0-gap/2,Z0+.05),W(u0-gap/2,Z1-.05)],'ghost',.6,{tone:.3,dash:[3,4]});
      const m=day.price_move_pct;
      text(pen,'DAY '+(d+1)+(m>=0?' +':' ')+m.toFixed(2)+'%',W(u0+.06,Z1-.06),6.5,{wall:'i',tone:.7,w:.8});
    });
    text(pen,'THE SAME FOUR DAYS, EVERY GENERATION',pen.wallQuad('i',U0,3.34,.01,.01,.07)[0],7,{wall:'i',tone:.55,w:.8});
    // wing signs under the screen
    text(pen,'REAL',pen.wallQuad('i',1.2,.92,.01,.01,.08)[0],18,{wall:'i',ink:'cyan',w:1.5});
    text(pen,'SCRAMBLED',pen.wallQuad('i',5.95,.92,.01,.01,.08)[0],15,{wall:'i',ink:'magenta',w:1.4});
    // the tote on the side wall
    if(f){const tote=pen.wallQuad('j',1.2,.35,3.4,2.05,.07);pen.shape(tote,['slate',.18],{w:1.3});
      const line=(s,z,ink,size)=>text(pen,s,pen.wallQuad('j',4.45,z,.01,.01,.14)[0],size,{wall:'j',ink,tone:.95,w:1.2});
      line('GEN '+S3(f.generation),2.25,'ghost',15);
      line('KEPT '+f.tribes.real.survived+' OF '+RUN.population,1.55,'ghost',11);
      line('OUT '+(f.tribes.real.eliminated+f.tribes.scrambled.eliminated),1.02,'ghost',11)}
    pen.rug(4.5,2.6,1,5.2,{ink:'slate',tone:.12,border:'slate'});
    // the desks: 25 per wing, four traders each. A trader eliminated this generation is dim.
    const desks=[];
    for(const [tribe,i0] of[['real',.75],['scrambled',5.75]])for(let c=0;c<5;c++)for(let r=0;r<5;r++)
      desks.push({tribe,i:i0+c*.72,j:2.9+r*.95,n:(c*5+r)*4});
    desks.sort((a,b)=>(a.i+a.j)-(b.i+b.j));
    // Selection: while the generation trades (SEL 0) every trader looks alike; as it is judged
    // the eliminated tumble off their desks and fade, and the survivors' desks light up.
    for(const d of desks){
      const rows=f?f.tribes[d.tribe].flies:[],ink=TRIBE_INK[d.tribe];
      const seats=[0,1,2,3].map(k=>rows[d.n+k]).filter(Boolean),kept=seats.filter(s=>!s.eliminated).length;
      const box=pen.box(d.i,d.j,0,.5,.34,.28,{ink:'slate',tone:.4,w:.6,shadow:true});
      if(kept&&SEL>0){pen.tint(box.top,ink,.45*SEL*kept/4);const [gx,gy]=p(d.i+.25,d.j+.17,.3);pen.halo(gx,gy,16*SEL,ink,.35*SEL*kept/4)}
      const [x0,y0]=p(d.i+.25,d.j+.17,.3);
      [[-9,-5],[9,-5],[-9,6],[9,6]].forEach(([dx,dy],k)=>{
        const fly=rows[d.n+k];if(!fly)return;
        const phase=d.n+k+(d.tribe==='real'?0:.5);
        if(fly.eliminated){const drop=easeIn(SEL)*30,side=(k%2?1:-1)*6*SEL;
          if(SEL<.999)pen.minifly(x0+dx+side,y0+dy-6+drop,1.05,ink,lerp(.9,.25,SEL),t*(1-SEL),phase);
          else pen.deadfly(x0+dx+side,y0+dy+24,.8,ink,.22,phase)}
        else pen.minifly(x0+dx,y0+dy-6-3*SEL,1.05+.15*SEL,ink,1,t,phase);
      });
    }
    const walk=(t*.12)%1,jj=3+Math.abs(walk*2-1)*4.2;
    pen.fly(5,jj,0,{t,pose:'hover',ink:'slate',scale:1.1,facing:walk<.5?1:-1,phase:1.7});
  }});

    else{text(pen,'WAITING FOR THE FINALE',pen.wallQuad('j',R0,2.3,.01,.01,.1)[0],12,{wall:'j',tone:.7,w:1.2});
      text(pen,fin&&fin.llm?fin.llm.model:'QWEN3.6 35B, LOCAL',pen.wallQuad('j',R0,1.7,.01,.01,.1)[0],7,{wall:'j',tone:.5})}
    pen.rug(1.6,3.2,4,3,{ink:'slate',tone:.12,border:'slate'});
    pen.table(2.4,3.6,2.4,1.4,.75,{ink:'slate',tone:.32});
    const [px,py]=p(3.7,4.0,.76);
    pen.shape([[px-14,py],[px+14,py-7],[px+22,py+2],[px-6,py+9]],['ghost',.18],{w:.7});
    for(let k=0;k<4;k++)pen.line([[px-10+k*2,py+1-k*2+2],[px+10+k*2,py-4-k*2+2]],'ghost',.5,{tone:.4,amp:0});
    pen.fly(3.3,4.5,.76,{t,pose:'sit',ink:'ghost',tone:.55,scale:2.1,phase:.4,glowStrength:.6,noShadow:true});
    pen.lamp(1.1,2.2,{t});pen.plant(6.3,6.2,0,{t,size:1});
  }});

/* =====================  THE ARCHIVE  =====================
   One poster per generation, printed as each generation is judged. */
room({id:'archive',col:3,row:1,w:8,d:7,h:3.2,
  style:{floor:['slate',.28],wall:['slate',.12],wall2:['slate',.15],planks:true},
  draw(pen,t,R){
    const p=pen.p;if(!RUN)return;
    const n=RUN.generations,cols=6;
    for(let g=0;g<n;g++){const c=g%cols,r=Math.floor(g/cols),u=.45+c*1.24,z=2.95-r*.66;
      const printed=g<=GEN,here=g===GEN,frame=pen.wallQuad('i',u,z-.56,1.08,.56,.06);
      pen.shape(frame,[printed?'slate':'paper',printed?.15:0],{w:here?1.5:.8,line:here?'gold':'ghost',lineTone:printed?.6:.22});
      if(!printed)continue;
      const fr=RUN.frames[g],at=(du,dz)=>pen.wallQuad('i',u+du,z+dz,.01,.01,.08)[0];
      text(pen,S3(g),at(.06,-.05),6.5,{wall:'i',ink:here?'gold':'ghost',w:.8});
      const words=headlineFor(RUN,g).toUpperCase().split(' ');let line='',rows=[];
      for(const w of words){if((line+' '+w).trim().length>16){rows.push(line);line=w}else line=(line+' '+w).trim()}rows.push(line);
      rows.slice(0,2).forEach((s,k)=>text(pen,s,at(.34,-.06-k*.1),3.4,{wall:'i',tone:.8,w:.45}));
      [[fr.tribes.real.equity.median,'cyan'],[fr.tribes.scrambled.equity.median,'magenta'],[fr.heroes.real.equity,'gold']].forEach(([v,ink],k)=>
        pen.tint(pen.wallQuad('i',u+.07,z-.5+k*.09,clamp((v-975)/70,.04,1)*.94,.055,.08),ink,.8));
    }
    text(pen,'THE ARCHIVE',pen.wallQuad('j',5.9,2.7,.01,.01,.08)[0],16,{wall:'j',w:1.4});
    text(pen,'ONE POSTER PER GENERATION',pen.wallQuad('j',5.9,2.2,.01,.01,.08)[0],7.5,{wall:'j',tone:.65});
    pen.bookcase('j',.5,2.2,2.1,{rows:4});
    pen.fly(5.4,4.8,0,{t,pose:'hover',ink:'slate',scale:1.15,facing:-1,phase:1.4});
    pen.rug(2,3.5,4.2,2.6,{ink:'slate',tone:.12,border:'slate'});
  }});

/* =====================  THE OVERFIT ROOM  =====================
   Training days, selected on, against validation days, never seen. Empty until that run lands. */
room({id:'overfit',col:1,row:2,w:8,d:7,h:3.2,
  style:{floor:['slate',.28],wall:['slate',.12],wall2:['slate',.15],planks:false},
  draw(pen,t,R){
    const p=pen.p,has=RUN&&RUN.frames.some(f=>f.tribes.real.validation);
    const board=pen.wallQuad('i',.5,.8,7,2.25,.05);pen.shape(board,['slate',.1],{w:1.2});
    text(pen,'THE OVERFIT ROOM',pen.wallQuad('j',5.9,2.75,.01,.01,.08)[0],14,{wall:'j',w:1.3});
    text(pen,'SOLID: TRAINING DAYS, SELECTED ON',pen.wallQuad('j',5.9,2.05,.01,.01,.08)[0],6.5,{wall:'j',tone:.7});
    text(pen,'DASHED: VALIDATION DAYS, NEVER SEEN',pen.wallQuad('j',5.9,1.78,.01,.01,.08)[0],6.5,{wall:'j',tone:.7});
    pen.fly(6.3,4.6,0,{t,pose:'hover',ink:'slate',scale:1.15,facing:-1,phase:2.2});
    if(!has){text(pen,'EMPTY UNTIL THE',pen.wallQuad('i',1.2,2.3,.01,.01,.08)[0],13,{wall:'i',tone:.6,w:1.2});
      text(pen,'VALIDATION RUN LANDS',pen.wallQuad('i',1.2,1.8,.01,.01,.08)[0],13,{wall:'i',tone:.6,w:1.2});return}
    const W=(u,z)=>p(u,.07,z),fr=RUN.frames,n=fr.length;
    const vals=fr.flatMap(f=>RUN.tribes.flatMap(tb=>[f.tribes[tb].fitness.median,f.tribes[tb].validation?f.tribes[tb].validation.fitness.median:0])).concat(0);
    const lo=Math.min(...vals),hi=Math.max(...vals),span=Math.max(hi-lo,1e-9);
    const Z=v=>1.05+(v-lo)/span*1.7,U=g=>.85+(n<2?0:g/(n-1))*6.2;
    pen.line([W(.8,Z(0)),W(7.2,Z(0))],'ghost',.7,{tone:.35,dash:[4,4],amp:0});
    for(const tb of RUN.tribes){const ink=TRIBE_INK[tb];
      const train=fr.slice(0,GEN+1).map((f,g)=>W(U(g),Z(f.tribes[tb].fitness.median)));
      const val=fr.slice(0,GEN+1).filter(f=>f.tribes[tb].validation).map(f=>W(U(f.generation),Z(f.tribes[tb].validation.fitness.median)));
      if(train.length>1)pen.line(train,ink,1.6,{amp:.2});else if(train.length)pen.dot(...train[0],2.2,ink,1);
      if(val.length>1)pen.line(val,ink,1.2,{tone:.8,dash:[5,4],amp:.2});else if(val.length)pen.dot(...val[0],2,ink,.8);
      const f=fr[GEN].tribes[tb];
      if(f.validation){const gap=f.fitness.median-f.validation.fitness.median;
        text(pen,tb+' gap '+(gap>=0?'+':'')+gap.toFixed(4),pen.wallQuad('i',.8,tb==='real'?2.95:2.7,.01,.01,.08)[0],6.5,{wall:'i',ink,w:.8})}}
  }});

/* =====================  THE OVERLAY  =====================
   What lives between rooms: a night sky, the building's sign, and the hero on its rounds. */
const buildingBounds=()=>ROOMS.reduce((a,r)=>[Math.min(a[0],r.bounds[0]),Math.min(a[1],r.bounds[1]),Math.max(a[2],r.bounds[2]),Math.max(a[3],r.bounds[3])],[1e9,1e9,-1e9,-1e9]);
function overlay(pen,t,a,b){
  if(!RUN)return;
  const B=buildingBounds(),cx=(B[0]+B[2])/2,S=stream('stars');
  for(let k=0;k<220;k++){const x=lerp(B[0]-420,B[2]+420,S()),y=lerp(B[1]-520,B[3]+260,S()),r=rand(S,.6,1.8),ph=rand(S,0,TAU);
    if(x<a.x||x>b.x||y<a.y||y>b.y)continue;
    if(ROOMS.some(q=>x>q.bounds[0]&&x<q.bounds[2]&&y>q.bounds[1]&&y<q.bounds[3]))continue;
    pen.dot(x,y,r,'ghost',.25+.35*(.5+.5*Math.sin(t*1.3+ph)))}
  textCentred(pen,'NATURAL SELECTION CAPITAL',[cx,B[1]-190],68,{w:5,gap:.3,amp:.5});
  textCentred(pen,'HQ · WHERE A HUNDRED FRUIT-FLY BRAINS TRADE BITCOIN',[cx,B[1]-82],20,{ink:'gold',w:2,tone:.9});
  if(CAM_MODE==='hero'&&HERO_POS){
    heroTrail.push([HERO_POS.x,HERO_POS.y]);if(heroTrail.length>28)heroTrail.shift();
    for(let k=1;k<heroTrail.length;k++)pen.line([heroTrail[k-1],heroTrail[k]],'gold',1.4,{tone:.6*k/heroTrail.length,amp:0});
    const hp=makePen(pen.ctx,{ox:HERO_POS.x,oy:HERO_POS.y,boil:pen.boil}),h=hero('real');
    hp.fly(0,0,0,{t,scale:1.7,ink:'gold',pose:'hover',noShadow:true,glowStrength:1.8,facing:HERO_POS.dir,phase:.3});
    if(h)text(pen,h.id+' · HERO CAM',[HERO_POS.x+22,HERO_POS.y-60],9,{ink:'gold',w:1})}
}

/* =====================  PLAYBACK  =====================
   A generation trades, then is judged: SEL runs 0 to 1 over the back half of each generation,
   while the eliminated fall, the survivors light up and the children hatch. The camera tours
   shot by shot - a room, then sometimes a push in on its detail - or follows the hero, or
   pulls back to the whole building. Everything runs on NOW(), so the recorder can step it. */
const MS_PER_GEN=3600,SEL_FROM=.45,SHOT_MS=4400,HERO_LEG_MS=5200,HERO_ZOOM=2.3;
const ROOM_ORDER=['lab','brain','floor','pile','nursery','hero','archive','overfit','model','vault'];
const SHOTS=[{room:'lab'},{room:'lab',focus:[4.9,3.2,1.0],zoom:2.4},{room:'brain'},{room:'floor'},
  {room:'floor',focus:[5,.2,2.3],zoom:1.9},{room:'pile'},{room:'nursery'},{room:'hero'},
  {room:'hero',focus:[3.3,4.6,1.3],zoom:2.5},{room:'archive'},{room:'overfit'},{room:'model'},
  {room:'model',focus:[3.3,4.5,1.7],zoom:2.3},{room:'vault'}];
const NAMES={lab:'lab',brain:'brain',floor:'floor',pile:'pile',nursery:'nursery',hero:"hero's desk",
             archive:'archive',overfit:'overfit',model:'model',vault:'vault'};
const DRIVEN=()=>!!window.__HEDGEFLY_VCLOCK_DRIVEN__;
let CAM_MODE='tour',genStart=0,shotStart=0,shotIndex=-1,heroStart=0,HERO_POS=null,heroTrail=[];
const ui={play:document.getElementById('play'),scrub:document.getElementById('scrub'),label:document.getElementById('label'),
          stat:document.getElementById('stat'),rooms:document.getElementById('rooms'),terminal:document.getElementById('terminal'),
          inset:document.getElementById('inset'),building:document.getElementById('building'),herocam:document.getElementById('herocam')};
const roomById=id=>ROOMS.find(r=>r.id===id);
function light(id){for(const b of ui.rooms.children)b.classList.toggle('on',b.dataset.room===id);
  ui.building.classList.toggle('on',CAM_MODE==='building');ui.herocam.classList.toggle('on',CAM_MODE==='hero')}
function shotTarget(s){const r=roomById(s.room),base=framing(r.bounds);if(!s.focus)return base;
  const [x,y]=iso(r.oi+s.focus[0],r.oj+s.focus[1],s.focus[2]);return {x,y,zoom:clamp(base.zoom*s.zoom,MIN_Z,MAX_Z)}}
function jump(target,ms){if(ms<=0){Object.assign(cam,target);camBase={...target};tween=null;lastCam=''}else flyTo(target,ms)}
function goShot(k,ms=2600){CAM_MODE='tour';shotIndex=(k+SHOTS.length)%SHOTS.length;shotStart=NOW();jump(shotTarget(SHOTS[shotIndex]),ms);light(SHOTS[shotIndex].room)}
function goToRoom(id,ms=1400){const r=roomById(id);if(!r)return;CAM_MODE='free';jump(framing(r.bounds),ms);light(id)}
function building(ms=2800){CAM_MODE='building';const B=buildingBounds();
  jump(framing([B[0]-60,B[1]-260,B[2]+60,B[3]+40]),ms);light(null)}
function heroCam(){CAM_MODE='hero';heroStart=NOW();heroTrail=[];tween=null;light(null)}
function heroCamTarget(){return CAM_MODE==='hero'&&HERO_POS?{x:HERO_POS.x,y:HERO_POS.y-26,zoom:HERO_ZOOM}:null}
function anchor(id){const r=roomById(id);const [x,y]=iso(r.oi+r.w/2,r.oj+r.d/2,1.9);return {x,y}}
function updateHero(now){
  const el=now-heroStart,n=ROOM_ORDER.length,k=Math.floor(el/HERO_LEG_MS)%n,u=(el%HERO_LEG_MS)/HERO_LEG_MS;
  const A=anchor(ROOM_ORDER[k]),Bp=anchor(ROOM_ORDER[(k+1)%n]),fly=.6;
  if(u<fly){const e=ease(u/fly);HERO_POS={x:lerp(A.x,Bp.x,e),y:lerp(A.y,Bp.y,e)-80*Math.sin(Math.PI*e),dir:Bp.x>=A.x?1:-1}}
  else HERO_POS={x:Bp.x,y:Bp.y+Math.sin(now/300)*4,dir:HERO_POS?HERO_POS.dir:1};
}
function paint(){
  if(!RUN)return;const f=F(),real=f.tribes.real,scr=f.tribes.scrambled,bh=RUN.competitor_results.buy_and_hold;
  ui.scrub.value=GEN;ui.label.textContent=`generation ${f.generation} / ${RUN.generations-1}`;
  ui.stat.innerHTML=`<span class="real">real</span> best ${money(real.equity.best)} · median ${money(real.equity.median)} &nbsp;|&nbsp; `+
    `<span class="scr">scrambled</span> best ${money(scr.equity.best)} · median ${money(scr.equity.median)} &nbsp;|&nbsp; `+
    `buy &amp; hold ${money(bh.final_equity)} &nbsp;|&nbsp; ${fallen().toLocaleString('en-US')} eliminated so far`+
    (real.validation?` &nbsp;|&nbsp; validation median real ${money(real.validation.equity.median)} · scrambled ${money(scr.validation.equity.median)}`:'')+
    (RUN.fake?' &nbsp;·&nbsp; FAKE DATA':'');
  ui.play.textContent=PLAYING?'pause':'play';lastCam='';
  const frame=ui.inset.querySelector('iframe');
  if(ui.inset.classList.contains('open')&&frame.contentWindow)frame.contentWindow.postMessage({hedgefly:'gen',gen:GEN},'*');
}
function setGeneration(g){if(!RUN)return;GEN=clamp(Math.round(g),0,RUN.generations-1);paint()}
function tickOnce(now){
  if(PLAYING&&RUN){
    if(now-genStart>=MS_PER_GEN){genStart=now;setGeneration(GEN+1>=RUN.generations?0:GEN+1)}
    const ph=(now-genStart)/MS_PER_GEN;SEL=ph<SEL_FROM?0:clamp((ph-SEL_FROM)/(.95-SEL_FROM),0,1);
    if(CAM_MODE==='tour'&&now-shotStart>=SHOT_MS&&!tween)goShot(shotIndex+1);
  }
  if(CAM_MODE==='hero')updateHero(now);
}
function tick(){if(!DRIVEN())requestAnimationFrame(tick);tickOnce(NOW())}
function openTerminal(on){
  ui.inset.classList.toggle('open',on);ui.terminal.classList.toggle('on',on);
  const frame=ui.inset.querySelector('iframe');
  if(on&&!frame.dataset.loaded){frame.dataset.loaded='1';frame.onload=()=>paint();
    if(window.__HEDGEFLY_TERMINAL__)
      frame.srcdoc=window.__HEDGEFLY_TERMINAL__.replace('<'+'!--HEDGEFLY-DATA--'+'>',
        '<'+'script>window.__HEDGEFLY_RUN__='+JSON.stringify(RUN).replace(/</g,'\\u003c')+';<'+'/script>');
    else frame.src='../terminal/index.html?data='+encodeURIComponent(qs.get('data')||'../hq/runs.json')}
}
function wireUI(){
  ui.play.onclick=()=>{PLAYING=!PLAYING;genStart=NOW();if(PLAYING&&CAM_MODE==='free')goShot(shotIndex+1);paint()};
  ui.scrub.oninput=e=>{PLAYING=false;SEL=1;setGeneration(+e.target.value)};
  ui.terminal.onclick=()=>openTerminal(!ui.inset.classList.contains('open'));
  ui.building.onclick=()=>building();
  ui.herocam.onclick=()=>CAM_MODE==='hero'?goShot(shotIndex+1):heroCam();
  for(const id of ROOM_ORDER){const b=document.createElement('button');b.textContent=NAMES[id];b.dataset.room=id;
    b.onclick=()=>goToRoom(id);ui.rooms.appendChild(b)}
  addEventListener('keydown',e=>{
    if(e.key===' '){ui.play.onclick();e.preventDefault()}
    else if(e.key==='['){PLAYING=false;SEL=1;setGeneration(GEN-1)}
    else if(e.key===']'){PLAYING=false;SEL=1;setGeneration(GEN+1)}
    else if(e.key==='t')openTerminal(!ui.inset.classList.contains('open'));
    else if(e.key==='b')building();
    else if(e.key==='h')ui.herocam.onclick();
  });
}
async function loadRun(){
  if(window.__HEDGEFLY_RUN__)return window.__HEDGEFLY_RUN__;
  const r=await fetch(qs.get('data')||'../hq/runs.json',{cache:'no-store'});
  if(!r.ok)throw new Error('runs.json: '+r.status);
  return r.json();
}
/* The recorder's handle (scripts/record_hq.mjs): step the clock, pick a shot, set the story. */
window.__hedgefly={ready:false,
  step(ms){window.__HEDGEFLY_VCLOCK__=(window.__HEDGEFLY_VCLOCK__||0)+ms;tickOnce(NOW());stepFrame()},
  shot(kind,arg,ms=0){if(kind==='tour')goShot(arg||0,ms);else if(kind==='room')goToRoom(arg,ms);
    else if(kind==='focus')goShot(SHOTS.findIndex(s=>s.room===arg&&s.focus),ms);
    else if(kind==='building')building(ms);else if(kind==='hero')heroCam()},
  play(on){PLAYING=on;genStart=NOW()},gen(g){setGeneration(g)},sel(s){SEL=s},open(o){OPEN=o},
  rooms:()=>ROOM_ORDER.slice(),hasFinale:()=>!!(RUN&&RUN.finale),generations:()=>RUN?RUN.generations:0};
async function boot(){
  if(qs.has('vertical'))document.body.classList.add('vertical');
  if(qs.has('clean')||qs.has('record'))document.body.classList.add('clean');
  try{RUN=await loadRun()}catch(e){console.error(e);ui.stat.textContent='no run data: serve visuals/ over http, or open visuals/dist/hedgefly.html';return}
  if(!(RUN.contract_version>=2)){ui.stat.textContent=`this page reads data contract v2 or later; the file is v${RUN.contract_version||1}`;return}
  ui.scrub.max=RUN.generations-1;
  GEN=clamp(+(qs.get('gen')||0),0,RUN.generations-1);
  PLAYING=qs.get('play')!=='0'&&!qs.has('still')&&!qs.has('record');
  SEL=qs.has('sel')?+qs.get('sel'):(PLAYING?0:1);OPEN=qs.has('open')?+qs.get('open'):1;
  wireUI();paint();start();
  const first=qs.get('room'),mode=qs.get('cam');
  if(mode==='building')building(0);else if(mode==='hero')heroCam();
  else if(first)goToRoom(first,0);else if(PLAYING)goShot(0,0);
  if(qs.has('terminal'))openTerminal(true);
  if(qs.has('record'))idleSince=-1e9;              // a recording drifts from its first frame
  genStart=NOW();window.__hedgefly.ready=true;
  if(!DRIVEN())requestAnimationFrame(tick);
}
boot();
</script>
</body></html>
